<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#111827">
<title>CapTrade v0.15</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:20;background:#111827;color:#fff;padding:15px}.head{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:26px}.ver{font-size:13px;color:#94a3b8;font-weight:800;margin-left:7px}.sub{font-size:13px;color:#cbd5e1}
.actions{display:flex;gap:7px}.actions button,.blue{border:0;border-radius:10px;padding:10px 12px;font-weight:800}.blue{background:#0a84ff;color:#fff}.share{background:#fff}
#search{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;font-size:16px}
.switch{max-width:900px;margin:14px auto 0;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.switch button{border:0;border-radius:10px;padding:11px;font-weight:800;background:#e5e7eb}.switch .on{background:#111827;color:#fff}
main,.board,.request{max-width:900px;margin:auto;padding:16px}.info{display:flex;justify-content:space-between;color:#6b7280;font-size:14px;margin-bottom:12px}
.grid,.tradegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card,.tradeitem{position:relative;border:0;border-radius:14px;background:#fff;padding:8px;text-align:center;box-shadow:0 2px 8px #0001}
.card.sel{outline:3px solid #0a84ff}.thumb{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#ddd}.thumb canvas{width:100%;height:100%;display:block}
.num{font-weight:800;color:#0a84ff;margin-top:5px}.boardname{font-size:12px;color:#6b7280}.badge{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:#0a84ff;color:#fff;font-weight:900;display:grid;place-items:center}
.board{display:none}.board.active{display:block}.boardwrap{position:relative;overflow:hidden;border-radius:14px}.boardwrap img{display:block;width:100%}
.hot{position:absolute;width:9.7%;aspect-ratio:1;border:0;border-radius:50%;background:transparent;transform:translate(-50%,-50%);z-index:3}
.check{position:absolute;width:17px;height:17px;border-radius:50%;background:#0a84ff;color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;transform:translate(45%,-105%);z-index:6;pointer-events:none;box-shadow:0 1px 3px #0007}
.gone{position:absolute;width:9.2%;aspect-ratio:1;border-radius:50%;background:#000;transform:translate(-50%,-50%);z-index:5;pointer-events:none}
.legend{display:flex;gap:16px;margin-top:12px;font-size:13px;color:#4b5563}.dot{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;margin-right:5px}.dot.b{background:#0a84ff;color:#fff}.dot.k{background:#000}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:100;padding:16px;align-items:center;justify-content:center}.modal.open{display:flex}.box{position:relative;width:100%;max-width:500px;max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:20px}
.close{position:absolute;right:10px;top:10px;border:0;border-radius:50%;width:38px;height:38px;font-size:24px}.detailpic{width:230px;height:230px;max-width:70vw;max-height:70vw;border-radius:50%;overflow:hidden;margin:18px auto 10px}.detailpic canvas{width:100%;height:100%}
.detailtitle{text-align:center;font-size:24px;font-weight:800}.detailboard{text-align:center;color:#6b7280}.wide{width:100%;border:0;border-radius:12px;padding:14px;margin-top:14px;font-size:16px;font-weight:800}
.remove{width:100%;border:0;border-radius:9px;padding:8px;margin-top:7px;background:#fee2e2;color:#b91c1c;font-weight:700}
.request{display:none}.request.active{display:block}.hidden{display:none!important}.request h2{text-align:center}.requestinfo{text-align:center;color:#6b7280;margin-bottom:14px}.finish{background:#111827;color:#fff}.cancel{background:#e5e7eb}.empty{text-align:center;padding:30px;color:#6b7280}
@media(min-width:600px){.grid,.tradegrid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<header><div class="head"><div class="top"><div><div><h1 style="display:inline">CapTrade</h1><span class="ver">v0.15</span></div><div class="sub">Meine Tausch-Kronkorken</div></div><div class="actions" id="headActions"><button id="tradeCount" class="blue" onclick="openTrade()">Tausch (0)</button><button class="share" onclick="sharePage()">Teilen</button></div></div><input id="search" placeholder="Nummer oder Brett suchen …" oninput="render()"></div></header>
<div id="switch" class="switch"><button id="listBtn" class="on" onclick="listView()">Liste</button><button id="boardBtn" onclick="boardView()">Brett</button></div>
<main id="main"><div class="info"><span id="count"></span><span>Brett F</span></div><div id="grid" class="grid"></div></main>
<section id="board" class="board"><div class="info"><span>Brettansicht</span><span>Brett F</span></div><div id="boardwrap" class="boardwrap"><img src="IMG_6469.jpeg?v=15" alt="Brett F"></div><div class="legend"><span><i class="dot b">✓</i>In Tauschliste</span><span><i class="dot k"></i>Weggetauscht</span></div></section>
<section id="request" class="request"><h2>Tauschanfrage</h2><div id="requestInfo" class="requestinfo"></div><div id="requestGrid" class="tradegrid"></div><button id="finish" class="wide finish">Tausch abschließen</button><button class="wide cancel" onclick="home()">Abbrechen / Zur Hauptansicht</button></section>
<div id="detail" class="modal" onclick="bgClose(event,'detail')"><div class="box"><button class="close" onclick="closeM('detail')">×</button><div id="detailPic" class="detailpic"></div><div id="detailTitle" class="detailtitle"></div><div id="detailBoard" class="detailboard"></div><button id="tradeBtn" class="wide blue"></button></div></div>
<div id="tradeModal" class="modal" onclick="bgClose(event,'tradeModal')"><div class="box"><button class="close" onclick="closeM('tradeModal')">×</button><h2 style="text-align:center">Meine Tausch-Auswahl</h2><div id="tradeContent"></div></div></div>
<script>
const IMG="IMG_6469.jpeg",W=1152,H=1536,CROP=112;
const ROWS=[
[[123,98],[215,87],[317,88],[415,80],[515,85],[616,85],[713,87],[814,87],[913,93]],
[[112,183],[207,181],[308,189],[418,178],[519,179],[616,176],[717,179],[818,177],[917,188],[1018,172]],
[[113,284],[212,284],[321,278],[417,273],[517,275],[622,263],[721,278],[819,275],[920,278],[1033,273]],
[[122,382],[224,369],[317,375],[412,376],[518,365],[619,373],[717,375],[826,370],[921,375],[1023,375]],
[[100,476],[206,484],[308,481],[409,476],[512,469],[617,470],[727,464],[819,476],[922,476],[1027,472]],
[[103,577],[203,583],[304,571],[401,574],[509,571],[610,574],[707,580],[819,577],[927,578],[1025,579]],
[[101,682],[206,680],[309,679],[407,683],[513,668],[614,671],[712,674],[821,680],[935,670],[1055,676]],
[[98,784],[194,783],[295,781],[410,784],[506,781],[623,775],[724,772],[836,772],[928,778],[1049,770]],
[[85,880],[193,879],[298,878],[400,880],[509,875],[619,881],[731,872],[826,890],[939,883],[1045,884]],
[[92,983],[195,986],[295,985],[398,985],[509,983],[607,991],[721,993],[827,993],[938,993],[1049,992]],
[[79,1087],[182,1090],[287,1089],[394,1091],[502,1099],[615,1100],[722,1107],[837,1107],[937,1105],[1063,1102]],
[[71,1197],[176,1204],[291,1196],[394,1204],[508,1207],[621,1215],[728,1211],[839,1225],[951,1221],[1059,1226]],
[[76,1304],[177,1313],[295,1306],[400,1315],[506,1316],[616,1328],[729,1328],[843,1340],[963,1335],[1073,1343]],
[[69,1443],[169,1438],[287,1435],[400,1441],[509,1437],[623,1450],[739,1441],[859,1457],[969,1447],[1084,1472]]
];
const caps=[];let n=1;ROWS.forEach((r,ri)=>r.forEach((p,pi)=>caps.push({number:n++,board:"F",row:ri+1,pos:pi+1,x:p[0],y:p[1]})));
function load(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch{return[]}}
let selected=load("captrade-selection"),traded=load("captrade-traded"),requestCaps=[];
const sel=c=>selected.includes(c.number),gone=c=>traded.includes(c.number);
function save(){localStorage.setItem("captrade-selection",JSON.stringify(selected));localStorage.setItem("captrade-traded",JSON.stringify(traded));counter();render();hotspots()}
const img=new Image();img.src=IMG+"?v=15";img.onload=()=>{render();counter();hotspots();checkRequest()};
function draw(cv,c,size=180){cv.width=cv.height=size;const sx=img.naturalWidth/W,sy=img.naturalHeight/H,cw=CROP*sx,ch=CROP*sy;cv.getContext("2d").drawImage(img,c.x*sx-cw/2,c.y*sy-ch/2,cw,ch,0,0,size,size)}
function capCard(c,removable=false){const d=document.createElement("div");d.className=removable?"tradeitem":"card"+(sel(c)?" sel":"");if(!removable&&sel(c)){const b=document.createElement("div");b.className="badge";b.textContent="✓";d.appendChild(b)}const t=document.createElement("div");t.className="thumb";const cv=document.createElement("canvas");draw(cv,c);t.appendChild(cv);const no=document.createElement("div");no.className="num";no.textContent="Nr. "+c.number;const bo=document.createElement("div");bo.className="boardname";bo.textContent="Brett "+c.board;d.append(t,no,bo);if(removable){const x=document.createElement("button");x.className="remove";x.textContent="Entfernen";x.onclick=()=>{selected=selected.filter(v=>v!==c.number);save();openTrade()};d.appendChild(x)}else d.onclick=()=>openCap(c);return d}
function render(){const q=document.getElementById("search").value.trim().toLowerCase(),g=document.getElementById("grid");g.innerHTML="";const a=caps.filter(c=>!gone(c)).filter(c=>!q||String(c.number).includes(q)||("brett "+c.board).toLowerCase().includes(q));document.getElementById("count").textContent=a.length+" Kronkorken";a.forEach(c=>g.appendChild(capCard(c)))}
function hotspots(){const w=document.getElementById("boardwrap");w.querySelectorAll(".hot,.check,.gone").forEach(e=>e.remove());caps.forEach(c=>{const l=c.x/W*100,t=c.y/H*100;if(gone(c)){const z=document.createElement("div");z.className="gone";z.style.left=l+"%";z.style.top=t+"%";w.appendChild(z);return}const h=document.createElement("button");h.className="hot";h.style.left=l+"%";h.style.top=t+"%";h.onclick=()=>openCap(c);w.appendChild(h);if(sel(c)){const k=document.createElement("div");k.className="check";k.textContent="✓";k.style.left=l+"%";k.style.top=t+"%";w.appendChild(k)}})}
function listView(){document.getElementById("main").style.display="block";document.getElementById("board").classList.remove("active");listBtn.classList.add("on");boardBtn.classList.remove("on")}
function boardView(){document.getElementById("main").style.display="none";document.getElementById("board").classList.add("active");boardBtn.classList.add("on");listBtn.classList.remove("on");hotspots()}
function openCap(c){if(gone(c))return;detailPic.innerHTML="";const cv=document.createElement("canvas");draw(cv,c,500);detailPic.appendChild(cv);detailTitle.textContent="Nr. "+c.number;detailBoard.textContent="Brett "+c.board;tradeBtn.textContent=sel(c)?"Aus Tauschliste entfernen":"Zum Tausch hinzufügen";tradeBtn.onclick=()=>{selected=sel(c)?selected.filter(v=>v!==c.number):[...selected,c.number];save();closeM("detail")};detail.classList.add("open")}
function counter(){tradeCount.textContent="Tausch ("+selected.filter(v=>!traded.includes(v)).length+")"}
function openTrade(){const c=document.getElementById("tradeContent");c.innerHTML="";const a=selected.map(v=>caps.find(x=>x.number===v)).filter(x=>x&&!gone(x));if(!a.length)c.innerHTML='<div class="empty">Noch keine Kronkorken ausgewählt.</div>';else{const g=document.createElement("div");g.className="tradegrid";a.forEach(x=>g.appendChild(capCard(x,true)));c.appendChild(g);const s=document.createElement("button");s.className="wide blue";s.textContent="Tauschliste teilen";s.onclick=shareTrade;c.appendChild(s)}tradeModal.classList.add("open")}
function tradeNums(){return [...new Set(selected.filter(v=>!traded.includes(v)))].sort((a,b)=>a-b)}
function tradeLink(){return location.origin+location.pathname+"?trade="+encodeURIComponent(tradeNums().join(","))}
async function shareTrade(){const a=tradeNums();if(!a.length)return;const text="Meine CapTrade-Auswahl:\n\n"+a.map(v=>"Nr. "+v+" – Brett F").join("\n")+"\n\nTauschanfrage öffnen:\n"+tradeLink();if(navigator.share)try{await navigator.share({title:"CapTrade – Tauschanfrage",text})}catch{}else{await navigator.clipboard.writeText(text);alert("Tauschanfrage kopiert.")}}
function checkRequest(){const p=new URLSearchParams(location.search).get("trade");if(!p)return;const nums=[...new Set(p.split(",").map(Number).filter(Number.isInteger))];const a=nums.map(v=>caps.find(c=>c.number===v)).filter(Boolean);if(a.length)showRequest(a)}
function showRequest(a){requestCaps=a;main.classList.add("hidden");board.classList.add("hidden");switch.classList.add("hidden");search.style.display="none";headActions.style.display="none";request.classList.add("active");const avail=a.filter(c=>!gone(c));requestInfo.textContent=avail.length+" Kronkorken in dieser Tauschanfrage";requestGrid.innerHTML="";avail.forEach(c=>requestGrid.appendChild(capCard(c)));finish.disabled=!avail.length;finish.style.opacity=avail.length?1:.45;finish.onclick=finishTrade}
function finishTrade(){const nums=requestCaps.filter(c=>!gone(c)).map(c=>c.number);if(!nums.length)return alert("Diese Kronkorken sind bereits weggetauscht.");if(!confirm(nums.length+" Kronkorken wirklich als weggetauscht markieren?\n\nSie verschwinden aus der Liste und werden auf dem Brett schwarz markiert."))return;traded=[...new Set([...traded,...nums])];selected=selected.filter(v=>!nums.includes(v));save();alert("Tausch abgeschlossen.");home()}
function home(){location.href=location.origin+location.pathname}
async function sharePage(){if(navigator.share)try{await navigator.share({title:"CapTrade",text:"Schau dir meine Tausch-Kronkorken an:",url:location.origin+location.pathname})}catch{}}
function closeM(id){document.getElementById(id).classList.remove("open")}function bgClose(e,id){if(e.target.id===id)closeM(id)}
</script>
</body></html>
