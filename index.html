<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>CapTrade</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f3f4f6;
  color: #111827;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #111827;
  color: white;
  padding: 16px;
  box-shadow: 0 2px 10px rgba(0,0,0,.15);
}

.header-inner {
  max-width: 900px;
  margin: auto;
}

.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

h1 {
  margin: 0;
  font-size: 26px;
}

.subtitle {
  margin-top: 3px;
  color: #cbd5e1;
  font-size: 13px;
}

.header-buttons {
  display: flex;
  gap: 8px;
  align-items: center;
}

.share-btn,
.trade-header-btn {
  border: 0;
  background: white;
  color: #111827;
  font-weight: 700;
  border-radius: 10px;
  padding: 10px 12px;
  cursor: pointer;
  white-space: nowrap;
}

.trade-header-btn {
  background: #0a84ff;
  color: white;
}

.search-wrap {
  margin-top: 14px;
}

#search {
  width: 100%;
  padding: 12px 14px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 16px;
}

.info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 14px;
  font-size: 14px;
  color: #4b5563;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.cap-card {
  background: white;
  border: 0;
  border-radius: 14px;
  padding: 9px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  cursor: pointer;
  text-align: center;
  position: relative;
}

.cap-card:active {
  transform: scale(.97);
}

.cap-card.selected {
  outline: 3px solid #0a84ff;
}

.selected-badge {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: #0a84ff;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 900;
  z-index: 2;
}

.thumb,
.trade-thumb,
.request-thumb {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  overflow: hidden;
  background: #e5e7eb;
}

.thumb {
  margin-bottom: 7px;
}

.thumb canvas,
.trade-thumb canvas,
.request-thumb canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.cap-number,
.trade-item-number,
.request-number {
  font-weight: 800;
  color: #0a84ff;
}

.cap-number {
  font-size: 15px;
}

.cap-board,
.trade-item-board,
.request-board {
  font-size: 12px;
  color: #6b7280;
  margin-top: 2px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.72);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal.open {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 500px;
  max-height: 92vh;
  overflow: auto;
  background: white;
  border-radius: 20px;
  position: relative;
  padding: 20px;
}

.close {
  position: absolute;
  right: 12px;
  top: 12px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 0;
  font-size: 24px;
  background: #f3f4f6;
  cursor: pointer;
  z-index: 5;
}

.detail-image {
  width: 230px;
  height: 230px;
  max-width: 72vw;
  max-height: 72vw;
  margin: 18px auto 12px;
  border-radius: 50%;
  overflow: hidden;
  background: #e5e7eb;
}

.detail-image canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.detail-title {
  font-size: 24px;
  font-weight: 800;
  text-align: center;
}

.detail-board {
  text-align: center;
  color: #6b7280;
  margin-top: 4px;
  font-size: 16px;
}

.trade-btn {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  margin-top: 16px;
  background: #0a84ff;
  color: white;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.trade-btn.selected {
  background: #16a34a;
}

.trade-title,
.request-title {
  font-size: 24px;
  font-weight: 800;
  text-align: center;
  margin: 4px 0 16px;
}

.trade-grid,
.request-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.trade-item,
.request-item {
  background: #f8fafc;
  padding: 8px;
  border-radius: 14px;
  text-align: center;
}

.remove-btn {
  width: 100%;
  padding: 10px;
  border: 0;
  border-radius: 10px;
  margin-top: 8px;
  background: #fee2e2;
  color: #b91c1c;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.trade-empty {
  text-align: center;
  color: #6b7280;
  padding: 35px 10px;
}

.trade-actions {
  margin-top: 16px;
}

.share-trade-btn,
.back-main-btn {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
}

.share-trade-btn {
  background: #0a84ff;
  color: white;
}

.back-main-btn {
  background: #111827;
  color: white;
  margin-top: 12px;
}

.clear-trade-btn {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 12px;
  background: #f3f4f6;
  color: #111827;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  margin-top: 8px;
}

.request-screen {
  display: none;
  max-width: 900px;
  margin: auto;
  padding: 16px;
}

.request-screen.active {
  display: block;
}

.normal-main.hidden {
  display: none;
}

.request-info {
  text-align: center;
  color: #6b7280;
  margin-bottom: 16px;
  font-size: 14px;
}

@media (min-width: 600px) {
  .grid {
    grid-template-columns: repeat(5, 1fr);
  }

  .trade-grid,
  .request-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<header>
<div class="header-inner">

  <div class="title-row">

    <div>
      <h1>CapTrade</h1>
      <div class="subtitle">Meine Tausch-Kronkorken</div>
    </div>

    <div class="header-buttons" id="normalHeaderButtons">

      <button
        id="tradeHeaderBtn"
        class="trade-header-btn"
        onclick="openTradeOverview()">
        Tausch (0)
      </button>

      <button
        class="share-btn"
        onclick="sharePage()">
        Teilen
      </button>

    </div>

  </div>

  <div class="search-wrap" id="searchWrap">
    <input
      id="search"
      type="search"
      placeholder="Nummer oder Brett suchen …"
      oninput="renderCaps()">
  </div>

</div>
</header>

<main id="normalMain" class="normal-main">

  <div class="info">
    <span id="count"></span>
    <span>Brett F</span>
  </div>

  <div id="grid" class="grid"></div>

</main>

<section id="requestScreen" class="request-screen">

  <div class="request-title">
    Tauschanfrage
  </div>

  <div id="requestInfo" class="request-info"></div>

  <div id="requestGrid" class="request-grid"></div>

  <button
    class="back-main-btn"
    onclick="backToMain()">
    Zur CapTrade-Hauptansicht
  </button>

</section>

<!-- DETAILANSICHT -->

<div
  id="detailModal"
  class="modal"
  onclick="modalBackground(event,'detailModal')">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal('detailModal')">
      ×
    </button>

    <div
      id="detailImage"
      class="detail-image">
    </div>

    <div
      id="detailTitle"
      class="detail-title">
    </div>

    <div
      id="detailBoard"
      class="detail-board">
    </div>

    <button
      id="tradeBtn"
      class="trade-btn">
      Zum Tausch hinzufügen
    </button>

  </div>

</div>

<!-- TAUSCHÜBERSICHT -->

<div
  id="tradeModal"
  class="modal"
  onclick="modalBackground(event,'tradeModal')">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal('tradeModal')">
      ×
    </button>

    <div class="trade-title">
      Meine Tausch-Auswahl
    </div>

    <div id="tradeContent"></div>

  </div>

</div>

<script>

const IMAGE = "IMG_6469.jpeg";
const BOARD = "F";
const START_NUMMER = 1;

const REF_WIDTH = 1152;
const REF_HEIGHT = 1536;
const REF_CROP = 112;

const ROWS = [

  [
    [123,98],[215,87],[317,88],[415,80],[515,85],
    [616,85],[713,87],[814,87],[913,93]
  ],

  [
    [112,183],[207,181],[308,189],[418,178],[519,179],
    [616,176],[717,179],[818,177],[917,188],[1018,172]
  ],

  [
    [113,284],[212,284],[321,278],[417,273],[517,275],
    [622,263],[721,278],[819,275],[920,278],[1033,273]
  ],

  [
    [122,382],[224,369],[317,375],[412,376],[518,365],
    [619,373],[717,375],[826,370],[921,375],[1023,375]
  ],

  [
    [100,476],[206,484],[308,481],[409,476],[512,469],
    [617,470],[727,464],[819,476],[922,476],[1027,472]
  ],

  [
    [103,577],[203,583],[304,571],[401,574],[509,571],
    [610,574],[707,580],[819,577],[927,578],[1025,579]
  ],

  [
    [101,682],[206,680],[309,679],[407,683],[513,668],
    [614,671],[712,674],[821,680],[935,670],[1055,676]
  ],

  [
    [98,784],[194,783],[295,781],[410,784],[506,781],
    [623,775],[724,772],[836,772],[928,778],[1049,770]
  ],

  [
    [85,880],[193,879],[298,878],[400,880],[509,875],
    [619,881],[731,872],[826,890],[939,883],[1045,884]
  ],

  [
    [92,983],[195,986],[295,985],[398,985],[509,983],
    [607,991],[721,993],[827,993],[938,993],[1049,992]
  ],

  [
    [79,1087],[182,1090],[287,1089],[394,1091],[502,1099],
    [615,1100],[722,1107],[837,1107],[937,1105],[1063,1102]
  ],

  [
    [71,1197],[176,1204],[291,1196],[394,1204],[508,1207],
    [621,1215],[728,1211],[839,1225],[951,1221],[1059,1226]
  ],

  [
    [76,1304],[177,1313],[295,1306],[400,1315],[506,1316],
    [616,1328],[729,1328],[843,1340],[963,1335],[1073,1343]
  ],

  [
    [69,1443],[169,1438],[287,1435],[400,1441],[509,1437],
    [623,1450],[739,1441],[859,1457],[969,1447],[1084,1472]
  ]

];

const caps = [];

let runningNumber = START_NUMMER;

ROWS.forEach((row,rowIndex) => {

  row.forEach((point,positionIndex) => {

    caps.push({
      number: runningNumber,
      board: BOARD,
      row: rowIndex + 1,
      position: positionIndex + 1,
      refX: point[0],
      refY: point[1]
    });

    runningNumber++;

  });

});


/* TAUSCHAUSWAHL */

let tradeSelection = [];

try {

  const saved =
    localStorage.getItem(
      "captrade-selection"
    );

  if (saved) {
    tradeSelection = JSON.parse(saved);
  }

} catch(e) {
  tradeSelection = [];
}


function saveTradeSelection() {

  localStorage.setItem(
    "captrade-selection",
    JSON.stringify(tradeSelection)
  );

  updateTradeCounter();
  renderCaps();

}


function isSelected(cap) {

  return tradeSelection.includes(
    cap.number
  );

}


function toggleTrade(cap) {

  if (isSelected(cap)) {

    tradeSelection =
      tradeSelection.filter(
        number =>
          number !== cap.number
      );

  } else {

    tradeSelection.push(
      cap.number
    );

  }

  saveTradeSelection();

}


/* BILD */

const sourceImage = new Image();

sourceImage.src =
  IMAGE + "?v=2";


sourceImage.onload = () => {

  renderCaps();

  updateTradeCounter();

  checkForTradeRequest();

};


sourceImage.onerror = () => {

  document.getElementById("grid").innerHTML =
    '<div class="trade-empty">' +
    'Das Bild konnte nicht geladen werden.' +
    '</div>';

};


/* SKALIERUNG */

function getScaledPosition(cap) {

  const scaleX =
    sourceImage.naturalWidth /
    REF_WIDTH;

  const scaleY =
    sourceImage.naturalHeight /
    REF_HEIGHT;

  return {

    x:
      cap.refX *
      scaleX,

    y:
      cap.refY *
      scaleY,

    cropX:
      REF_CROP *
      scaleX,

    cropY:
      REF_CROP *
      scaleY

  };

}


/* KRONKORKEN ZEICHNEN */

function drawCap(
  canvas,
  cap,
  outputSize = 180
) {

  const ctx =
    canvas.getContext("2d");

  canvas.width =
    outputSize;

  canvas.height =
    outputSize;

  const p =
    getScaledPosition(cap);

  const sx =
    p.x -
    p.cropX / 2;

  const sy =
    p.y -
    p.cropY / 2;

  ctx.clearRect(
    0,
    0,
    outputSize,
    outputSize
  );

  ctx.drawImage(
    sourceImage,

    sx,
    sy,

    p.cropX,
    p.cropY,

    0,
    0,

    outputSize,
    outputSize
  );

}


/* HAUPTANSICHT */

function renderCaps() {

  const grid =
    document.getElementById(
      "grid"
    );

  const search =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();

  grid.innerHTML = "";

  const filtered =
    caps.filter(cap => {

      if (!search) {
        return true;
      }

      return (

        String(cap.number)
          .includes(search)

        ||

        ("brett " + cap.board)
          .toLowerCase()
          .includes(search)

        ||

        cap.board
          .toLowerCase()
          .includes(search)

      );

    });


  document
    .getElementById(
      "count"
    )
    .textContent =
      filtered.length +
      " Kronkorken";


  filtered.forEach(cap => {

    const card =
      document.createElement(
        "button"
      );

    card.className =
      "cap-card";


    if (isSelected(cap)) {

      card.classList.add(
        "selected"
      );

      const badge =
        document.createElement(
          "div"
        );

      badge.className =
        "selected-badge";

      badge.textContent =
        "✓";

      card.appendChild(
        badge
      );

    }


    const thumb =
      document.createElement(
        "div"
      );

    thumb.className =
      "thumb";


    const canvas =
      document.createElement(
        "canvas"
      );

    drawCap(
      canvas,
      cap,
      200
    );

    thumb.appendChild(
      canvas
    );


    const number =
      document.createElement(
        "div"
      );

    number.className =
      "cap-number";

    number.textContent =
      "Nr. " +
      cap.number;


    const board =
      document.createElement(
        "div"
      );

    board.className =
      "cap-board";

    board.textContent =
      "Brett " +
      cap.board;


    card.appendChild(
      thumb
    );

    card.appendChild(
      number
    );

    card.appendChild(
      board
    );


    card.onclick = () => {

      openCap(cap);

    };


    grid.appendChild(
      card
    );

  });

}


/* DETAIL */

function openCap(cap) {

  const container =
    document.getElementById(
      "detailImage"
    );

  container.innerHTML = "";


  const canvas =
    document.createElement(
      "canvas"
    );

  drawCap(
    canvas,
    cap,
    500
  );

  container.appendChild(
    canvas
  );


  document
    .getElementById(
      "detailTitle"
    )
    .textContent =
      "Nr. " +
      cap.number;


  document
    .getElementById(
      "detailBoard"
    )
    .textContent =
      "Brett " +
      cap.board;


  const tradeBtn =
    document.getElementById(
      "tradeBtn"
    );


  if (isSelected(cap)) {

    tradeBtn.textContent =
      "✓ Bereits ausgewählt";

    tradeBtn.classList.add(
      "selected"
    );

  } else {

    tradeBtn.textContent =
      "Zum Tausch hinzufügen";

    tradeBtn.classList.remove(
      "selected"
    );

  }


  tradeBtn.onclick = () => {

    toggleTrade(cap);

    closeModal(
      "detailModal"
    );

    history.replaceState(
      null,
      "",
      window.location.pathname
    );

  };


  document
    .getElementById(
      "detailModal"
    )
    .classList
    .add("open");

}


/* TAUSCHZÄHLER */

function updateTradeCounter() {

  document
    .getElementById(
      "tradeHeaderBtn"
    )
    .textContent =
      "Tausch (" +
      tradeSelection.length +
      ")";

}


/* TAUSCHÜBERSICHT */

function openTradeOverview() {

  renderTradeOverview();

  document
    .getElementById(
      "tradeModal"
    )
    .classList
    .add("open");

}


function renderTradeOverview() {

  const content =
    document.getElementById(
      "tradeContent"
    );

  content.innerHTML = "";


  if (!tradeSelection.length) {

    content.innerHTML =
      '<div class="trade-empty">' +
      'Noch keine Kronkorken ausgewählt.' +
      '</div>';

    return;

  }


  const selectedCaps =
    tradeSelection
      .map(number =>
        caps.find(
          cap =>
            cap.number === number
        )
      )
      .filter(Boolean);


  const grid =
    document.createElement(
      "div"
    );

  grid.className =
    "trade-grid";


  selectedCaps.forEach(cap => {

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "trade-item";


    const thumb =
      document.createElement(
        "div"
      );

    thumb.className =
      "trade-thumb";


    const canvas =
      document.createElement(
        "canvas"
      );

    drawCap(
      canvas,
      cap,
      180
    );

    thumb.appendChild(
      canvas
    );


    const number =
      document.createElement(
        "div"
      );

    number.className =
      "trade-item-number";

    number.textContent =
      "Nr. " +
      cap.number;


    const board =
      document.createElement(
        "div"
      );

    board.className =
      "trade-item-board";

    board.textContent =
      "Brett " +
      cap.board;


    const remove =
      document.createElement(
        "button"
      );

    remove.className =
      "remove-btn";

    remove.textContent =
      "Entfernen";


    remove.onclick = () => {

      tradeSelection =
        tradeSelection.filter(
          number =>
            number !== cap.number
        );

      saveTradeSelection();

      renderTradeOverview();

    };


    item.appendChild(
      thumb
    );

    item.appendChild(
      number
    );

    item.appendChild(
      board
    );

    item.appendChild(
      remove
    );


    grid.appendChild(
      item
    );

  });


  content.appendChild(
    grid
  );


  const actions =
    document.createElement(
      "div"
    );

  actions.className =
    "trade-actions";


  const shareBtn =
    document.createElement(
      "button"
    );

  shareBtn.className =
    "share-trade-btn";

  shareBtn.textContent =
    "Tauschliste teilen";

  shareBtn.onclick =
    shareTradeSelection;


  const clearBtn =
    document.createElement(
      "button"
    );

  clearBtn.className =
    "clear-trade-btn";

  clearBtn.textContent =
    "Auswahl leeren";


  clearBtn.onclick = () => {

    if (
      confirm(
        "Komplette Tausch-Auswahl löschen?"
      )
    ) {

      tradeSelection = [];

      saveTradeSelection();

      renderTradeOverview();

    }

  };


  actions.appendChild(
    shareBtn
  );

  actions.appendChild(
    clearBtn
  );


  content.appendChild(
    actions
  );

}


/* =====================================================
   NEU:
   TAUSCHLINK MIT AUSWAHL
   ===================================================== */

function buildTradeLink() {

  const sorted =
    [...tradeSelection]
      .sort(
        (a,b) =>
          a - b
      );


  const numbers =
    sorted.join(",");


  return (
    window.location.origin +
    window.location.pathname +
    "?trade=" +
    encodeURIComponent(
      numbers
    )
  );

}


/* TAUSCHLISTE TEILEN */

async function shareTradeSelection() {

  if (!tradeSelection.length) {

    alert(
      "Noch keine Kronkorken ausgewählt."
    );

    return;

  }


  const sorted =
    [...tradeSelection]
      .sort(
        (a,b) =>
          a - b
      );


  const tradeLink =
    buildTradeLink();


  const text =
    "Meine CapTrade-Auswahl:\n\n" +

    sorted
      .map(number => {

        const cap =
          caps.find(
            item =>
              item.number === number
          );

        return (
          "Nr. " +
          number +
          " – Brett " +
          cap.board
        );

      })
      .join("\n") +

    "\n\n" +
    "Tauschanfrage öffnen:\n" +
    tradeLink;


  if (navigator.share) {

    try {

      await navigator.share({

        title:
          "CapTrade – Tauschanfrage",

        text:
          text

      });

    }

    catch(e) {}

  }

  else {

    try {

      await navigator
        .clipboard
        .writeText(
          text
        );

      alert(
        "Tauschanfrage wurde kopiert."
      );

    }

    catch(e) {}

  }

}


/* =====================================================
   TAUSCHANFRAGE AUS LINK LESEN
   ===================================================== */

function checkForTradeRequest() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const trade =
    params.get(
      "trade"
    );


  if (!trade) {
    return;
  }


  const numbers =
    trade
      .split(",")
      .map(
        value =>
          Number(value)
      )
      .filter(
        value =>
          Number.isInteger(value)
      );


  const requestedCaps =
    numbers
      .map(number =>
        caps.find(
          cap =>
            cap.number === number
        )
      )
      .filter(Boolean);


  if (!requestedCaps.length) {
    return;
  }


  showTradeRequest(
    requestedCaps
  );

}


/* =====================================================
   TAUSCHANFRAGE ANZEIGEN
   ===================================================== */

function showTradeRequest(
  requestedCaps
) {

  document
    .getElementById(
      "normalMain"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "searchWrap"
    )
    .style
    .display =
      "none";


  document
    .getElementById(
      "normalHeaderButtons"
    )
    .style
    .display =
      "none";


  const screen =
    document.getElementById(
      "requestScreen"
    );


  screen.classList.add(
    "active"
  );


  document
    .getElementById(
      "requestInfo"
    )
    .textContent =
      requestedCaps.length +
      " Kronkorken ausgewählt";


  const grid =
    document.getElementById(
      "requestGrid"
    );


  grid.innerHTML = "";


  requestedCaps.forEach(cap => {

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "request-item";


    const thumb =
      document.createElement(
        "div"
      );

    thumb.className =
      "request-thumb";


    const canvas =
      document.createElement(
        "canvas"
      );

    drawCap(
      canvas,
      cap,
      180
    );

    thumb.appendChild(
      canvas
    );


    const number =
      document.createElement(
        "div"
      );

    number.className =
      "request-number";

    number.textContent =
      "Nr. " +
      cap.number;


    const board =
      document.createElement(
        "div"
      );

    board.className =
      "request-board";

    board.textContent =
      "Brett " +
      cap.board;


    item.appendChild(
      thumb
    );

    item.appendChild(
      number
    );

    item.appendChild(
      board
    );


    grid.appendChild(
      item
    );

  });

}


/* ZURÜCK ZUR HAUPTANSICHT */

function backToMain() {

  window.location.href =
    window.location.origin +
    window.location.pathname;

}


/* NORMALE SEITE TEILEN */

async function sharePage() {

  const data = {

    title:
      "CapTrade",

    text:
      "Schau dir meine Tausch-Kronkorken an:",

    url:
      window.location.origin +
      window.location.pathname

  };


  if (navigator.share) {

    try {

      await navigator.share(
        data
      );

    }

    catch(e) {}

  }

}


/* MODALS */

function closeModal(id) {

  document
    .getElementById(id)
    .classList
    .remove("open");

}


function modalBackground(
  event,
  id
) {

  if (
    event.target.id === id
  ) {

    closeModal(id);

  }

}
