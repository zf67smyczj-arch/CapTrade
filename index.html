<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>CapTrade v0.14</title>

<style>
* { box-sizing:border-box; }

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f3f4f6;
  color:#111827;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#111827;
  color:white;
  padding:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header-inner{
  max-width:900px;
  margin:auto;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.title-box{
  display:flex;
  align-items:baseline;
  gap:8px;
}

h1{
  margin:0;
  font-size:26px;
}

.version{
  font-size:13px;
  color:#94a3b8;
  font-weight:800;
}

.subtitle{
  margin-top:3px;
  color:#cbd5e1;
  font-size:13px;
}

.header-buttons{
  display:flex;
  gap:8px;
}

.share-btn,
.trade-header-btn{
  border:0;
  font-weight:700;
  border-radius:10px;
  padding:10px 12px;
  cursor:pointer;
}

.share-btn{
  background:white;
  color:#111827;
}

.trade-header-btn{
  background:#0a84ff;
  color:white;
}

.search-wrap{
  margin-top:14px;
}

#search{
  width:100%;
  padding:12px 14px;
  border:0;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

.view-switch{
  max-width:900px;
  margin:14px auto 0;
  padding:0 16px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.view-btn{
  border:0;
  border-radius:10px;
  padding:11px;
  font-weight:800;
  background:#e5e7eb;
  color:#111827;
}

.view-btn.active{
  background:#111827;
  color:white;
}

main,
.board-view,
.request-screen{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.info{
  display:flex;
  justify-content:space-between;
  margin-bottom:14px;
  font-size:14px;
  color:#4b5563;
}

/* LISTE */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.cap-card{
  background:white;
  border:0;
  border-radius:14px;
  padding:9px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  text-align:center;
  position:relative;
}

.cap-card.selected{
  outline:3px solid #0a84ff;
}

.selected-badge{
  position:absolute;
  top:7px;
  right:7px;
  width:27px;
  height:27px;
  border-radius:50%;
  background:#0a84ff;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  z-index:2;
}

.thumb,
.trade-thumb,
.request-thumb{
  width:100%;
  aspect-ratio:1;
  border-radius:50%;
  overflow:hidden;
  background:#e5e7eb;
}

.thumb{
  margin-bottom:7px;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

.cap-number,
.trade-item-number,
.request-number{
  font-weight:800;
  color:#0a84ff;
}

.cap-board,
.trade-item-board,
.request-board{
  font-size:12px;
  color:#6b7280;
  margin-top:2px;
}

/* BRETT */

.board-view{
  display:none;
}

.board-view.active{
  display:block;
}

.board-image-wrap{
  position:relative;
  width:100%;
  border-radius:14px;
  overflow:hidden;
  background:white;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.board-image-wrap img{
  display:block;
  width:100%;
  height:auto;
}

/* unsichtbarer Klickbereich */

.cap-hotspot{
  position:absolute;
  width:9.7%;
  aspect-ratio:1;
  border-radius:50%;
  transform:translate(-50%,-50%);
  border:0;
  background:transparent;
  padding:0;
  z-index:3;
}

/* BLAUER HAKEN */

.board-check{
  position:absolute;
  width:25px;
  height:25px;
  border-radius:50%;
  background:#0a84ff;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  font-weight:900;
  transform:translate(10%,-85%);
  z-index:6;
  pointer-events:none;
  box-shadow:0 1px 4px rgba(0,0,0,.3);
}

/* SCHWARZER KREIS */

.board-gone{
  position:absolute;
  width:9.2%;
  aspect-ratio:1;
  border-radius:50%;
  background:rgba(0,0,0,.94);
  transform:translate(-50%,-50%);
  z-index:5;
  pointer-events:none;
}

/* LEGENDE */

.legend{
  margin-top:14px;
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  font-size:13px;
  color:#4b5563;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:7px;
}

.legend-check{
  width:22px;
  height:22px;
  border-radius:50%;
  background:#0a84ff;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.legend-gone{
  width:22px;
  height:22px;
  border-radius:50%;
  background:#000;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.modal.open{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:500px;
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:20px;
  position:relative;
  padding:20px;
}

.close{
  position:absolute;
  right:12px;
  top:12px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:0;
  font-size:24px;
  background:#f3f4f6;
}

.detail-image{
  width:230px;
  height:230px;
  max-width:72vw;
  max-height:72vw;
  margin:18px auto 12px;
  border-radius:50%;
  overflow:hidden;
  background:#e5e7eb;
}

.detail-title{
  font-size:24px;
  font-weight:800;
  text-align:center;
}

.detail-board{
  text-align:center;
  color:#6b7280;
  margin-top:4px;
}

.trade-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  margin-top:16px;
  background:#0a84ff;
  color:white;
  font-size:16px;
  font-weight:800;
}

.trade-btn.selected{
  background:#16a34a;
}

/* TAUSCH */

.trade-title,
.request-title{
  font-size:24px;
  font-weight:800;
  text-align:center;
  margin:4px 0 16px;
}

.trade-grid,
.request-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.trade-item,
.request-item{
  background:#f8fafc;
  padding:8px;
  border-radius:14px;
  text-align:center;
}

.remove-btn{
  width:100%;
  padding:9px;
  border:0;
  border-radius:9px;
  margin-top:8px;
  background:#fee2e2;
  color:#b91c1c;
  font-weight:700;
}

.trade-empty{
  text-align:center;
  color:#6b7280;
  padding:35px 10px;
}

.trade-actions{
  margin-top:16px;
}

.share-trade-btn,
.clear-trade-btn,
.back-main-btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  font-weight:800;
  font-size:15px;
}

.share-trade-btn{
  background:#0a84ff;
  color:white;
}

.clear-trade-btn{
  margin-top:8px;
  background:#f3f4f6;
}

.back-main-btn{
  margin-top:16px;
  background:#111827;
  color:white;
}

.request-screen{
  display:none;
}

.request-screen.active{
  display:block;
}

.hidden{
  display:none !important;
}

.request-info{
  text-align:center;
  color:#6b7280;
  margin-bottom:16px;
}

@media(min-width:600px){

  .grid{
    grid-template-columns:repeat(5,1fr);
  }

  .trade-grid,
  .request-grid{
    grid-template-columns:repeat(4,1fr);
  }

}
</style>
</head>

<body>

<header>
<div class="header-inner">

<div class="title-row">

<div>

<div class="title-box">
<h1>CapTrade</h1>
<span class="version">v0.14</span>
</div>

<div class="subtitle">
Meine Tausch-Kronkorken
</div>

</div>

<div
  class="header-buttons"
  id="normalHeaderButtons">

<button
  id="tradeHeaderBtn"
  class="trade-header-btn"
  onclick="openTradeOverview()">
Tausch (0)
</button>

<button
  class="share-btn"
  onclick="sharePage()">
Teilen
</button>

</div>

</div>

<div
  class="search-wrap"
  id="searchWrap">

<input
  id="search"
  type="search"
  placeholder="Nummer oder Brett suchen …"
  oninput="renderCaps()">

</div>

</div>
</header>


<div
  id="viewSwitch"
  class="view-switch">

<button
  id="listViewBtn"
  class="view-btn active"
  onclick="showListView()">
Liste
</button>

<button
  id="boardViewBtn"
  class="view-btn"
  onclick="showBoardView()">
Brett
</button>

</div>


<main id="normalMain">

<div class="info">
<span id="count"></span>
<span>Brett F</span>
</div>

<div
  id="grid"
  class="grid">
</div>

</main>


<section
  id="boardView"
  class="board-view">

<div class="info">
<span>Brettansicht</span>
<span>Brett F</span>
</div>

<div
  id="boardImageWrap"
  class="board-image-wrap">

<img
  id="boardImage"
  src="IMG_6469.jpeg?v=14"
  alt="Brett F">

</div>

<div class="legend">

<div class="legend-item">
<span class="legend-check">✓</span>
<span>In Tauschliste</span>
</div>

<div class="legend-item">
<span class="legend-gone"></span>
<span>Weggetauscht</span>
</div>

</div>

</section>


<section
  id="requestScreen"
  class="request-screen">

<div class="request-title">
Tauschanfrage
</div>

<div
  id="requestInfo"
  class="request-info">
</div>

<div
  id="requestGrid"
  class="request-grid">
</div>

<button
  class="back-main-btn"
  onclick="backToMain()">
Zur CapTrade-Hauptansicht
</button>

</section>


<!-- DETAIL -->

<div
  id="detailModal"
  class="modal"
  onclick="modalBackground(event,'detailModal')">

<div class="modal-box">

<button
  class="close"
  onclick="closeModal('detailModal')">
×
</button>

<div
  id="detailImage"
  class="detail-image">
</div>

<div
  id="detailTitle"
  class="detail-title">
</div>

<div
  id="detailBoard"
  class="detail-board">
</div>

<button
  id="tradeBtn"
  class="trade-btn">
Zum Tausch hinzufügen
</button>

</div>
</div>


<!-- TAUSCHÜBERSICHT -->

<div
  id="tradeModal"
  class="modal"
  onclick="modalBackground(event,'tradeModal')">

<div class="modal-box">

<button
  class="close"
  onclick="closeModal('tradeModal')">
×
</button>

<div class="trade-title">
Meine Tausch-Auswahl
</div>

<div id="tradeContent"></div>

</div>
</div>


<script>

/* =========================================
   CAPTRADE v0.14
========================================= */

const VERSION = "0.14";

const IMAGE = "IMG_6469.jpeg";

const BOARD = "F";

const START_NUMMER = 1;

const REF_WIDTH = 1152;
const REF_HEIGHT = 1536;
const REF_CROP = 112;


/* =========================================
   POSITIONEN BRETT F
========================================= */

const ROWS = [

[
[123,98],[215,87],[317,88],[415,80],[515,85],
[616,85],[713,87],[814,87],[913,93]
],

[
[112,183],[207,181],[308,189],[418,178],[519,179],
[616,176],[717,179],[818,177],[917,188],[1018,172]
],

[
[113,284],[212,284],[321,278],[417,273],[517,275],
[622,263],[721,278],[819,275],[920,278],[1033,273]
],

[
[122,382],[224,369],[317,375],[412,376],[518,365],
[619,373],[717,375],[826,370],[921,375],[1023,375]
],

[
[100,476],[206,484],[308,481],[409,476],[512,469],
[617,470],[727,464],[819,476],[922,476],[1027,472]
],

[
[103,577],[203,583],[304,571],[401,574],[509,571],
[610,574],[707,580],[819,577],[927,578],[1025,579]
],

[
[101,682],[206,680],[309,679],[407,683],[513,668],
[614,671],[712,674],[821,680],[935,670],[1055,676]
],

[
[98,784],[194,783],[295,781],[410,784],[506,781],
[623,775],[724,772],[836,772],[928,778],[1049,770]
],

[
[85,880],[193,879],[298,878],[400,880],[509,875],
[619,881],[731,872],[826,890],[939,883],[1045,884]
],

[
[92,983],[195,986],[295,985],[398,985],[509,983],
[607,991],[721,993],[827,993],[938,993],[1049,992]
],

[
[79,1087],[182,1090],[287,1089],[394,1091],[502,1099],
[615,1100],[722,1107],[837,1107],[937,1105],[1063,1102]
],

[
[71,1197],[176,1204],[291,1196],[394,1204],[508,1207],
[621,1215],[728,1211],[839,1225],[951,1221],[1059,1226]
],

[
[76,1304],[177,1313],[295,1306],[400,1315],[506,1316],
[616,1328],[729,1328],[843,1340],[963,1335],[1073,1343]
],

[
[69,1443],[169,1438],[287,1435],[400,1441],[509,1437],
[623,1450],[739,1441],[859,1457],[969,1447],[1084,1472]
]

];


/* =========================================
   KRONKORKEN ERSTELLEN
========================================= */

const caps = [];

let runningNumber =
  START_NUMMER;

ROWS.forEach(
(row,rowIndex)=>{

row.forEach(
(point,positionIndex)=>{

caps.push({

number:
runningNumber,

board:
BOARD,

row:
rowIndex+1,

position:
positionIndex+1,

refX:
point[0],

refY:
point[1]

});

runningNumber++;

});

});


/* =========================================
   TAUSCHAUSWAHL LADEN
========================================= */

let tradeSelection = [];

try{

const saved =
localStorage.getItem(
"captrade-selection"
);

if(saved){

tradeSelection =
JSON.parse(saved);

}

}catch(e){}


/* =========================================
   WEGGETAUSCHTE LADEN
========================================= */

let tradedCaps = [];

try{

const saved =
localStorage.getItem(
"captrade-traded"
);

if(saved){

tradedCaps =
JSON.parse(saved);

}

}catch(e){}


/* =========================================
   STATUS
========================================= */

function isSelected(cap){

return tradeSelection.includes(
cap.number
);

}


function isTraded(cap){

return tradedCaps.includes(
cap.number
);

}


/* =========================================
   SPEICHERN
========================================= */

function saveTradeSelection(){

localStorage.setItem(
"captrade-selection",
JSON.stringify(
tradeSelection
)
);

updateTradeCounter();

renderCaps();

buildBoardHotspots();

}


/* =========================================
   TAUSCH AUSWAHL
========================================= */

function toggleTrade(cap){

if(isTraded(cap)){
return;
}

if(isSelected(cap)){

tradeSelection =
tradeSelection.filter(
n=>n!==cap.number
);

}else{

tradeSelection.push(
cap.number
);

}

saveTradeSelection();

}


/* =========================================
   BILD LADEN
========================================= */

const sourceImage =
new Image();

sourceImage.src =
IMAGE+"?v=14";

sourceImage.onload=()=>{

renderCaps();

updateTradeCounter();

buildBoardHotspots();

checkForTradeRequest();

};


/* =========================================
   SKALIERUNG
========================================= */

function getScaledPosition(cap){

const scaleX =
sourceImage.naturalWidth /
REF_WIDTH;

const scaleY =
sourceImage.naturalHeight /
REF_HEIGHT;

return{

x:
cap.refX*scaleX,

y:
cap.refY*scaleY,

cropX:
REF_CROP*scaleX,

cropY:
REF_CROP*scaleY

};

}


/* =========================================
   EINZELBILD
========================================= */

function drawCap(
canvas,
cap,
outputSize=180
){

const ctx =
canvas.getContext("2d");

canvas.width =
outputSize;

canvas.height =
outputSize;

const p =
getScaledPosition(cap);

ctx.drawImage(

sourceImage,

p.x-p.cropX/2,
p.y-p.cropY/2,

p.cropX,
p.cropY,

0,
0,

outputSize,
outputSize

);

}


/* =========================================
   LISTE
========================================= */

function renderCaps(){

const grid =
document.getElementById(
"grid"
);

const search =
document.getElementById(
"search"
).value
.trim()
.toLowerCase();

grid.innerHTML="";


/*
  Weggetauschte erscheinen
  NICHT mehr in der Liste.
*/

const availableCaps =
caps.filter(
cap=>!isTraded(cap)
);


const filtered =
availableCaps.filter(cap=>{

if(!search){
return true;
}

return(

String(cap.number)
.includes(search)

||

("brett "+cap.board)
.toLowerCase()
.includes(search)

||

cap.board
.toLowerCase()
.includes(search)

);

});


document.getElementById(
"count"
).textContent =

filtered.length+
" Kronkorken";


filtered.forEach(cap=>{

const card =
document.createElement(
"button"
);

card.className =
"cap-card";


if(isSelected(cap)){

card.classList.add(
"selected"
);

const badge =
document.createElement(
"div"
);

badge.className =
"selected-badge";

badge.textContent =
"✓";

card.appendChild(
badge
);

}


const thumb =
document.createElement(
"div"
);

thumb.className =
"thumb";


const canvas =
document.createElement(
"canvas"
);

drawCap(
canvas,
cap,
200
);

thumb.appendChild(
canvas
);


const number =
document.createElement(
"div"
);

number.className =
"cap-number";

number.textContent =
"Nr. "+cap.number;


const board =
document.createElement(
"div"
);

board.className =
"cap-board";

board.textContent =
"Brett "+cap.board;


card.appendChild(
thumb
);

card.appendChild(
number
);

card.appendChild(
board
);


card.onclick=()=>{

openCap(cap);

};


grid.appendChild(
card
);

});

}


/* =========================================
   BRETT OVERLAYS
========================================= */

function buildBoardHotspots(){

const wrap =
document.getElementById(
"boardImageWrap"
);


/*
  alte Overlays löschen
*/

wrap.querySelectorAll(
".cap-hotspot,.board-check,.board-gone"
).forEach(
el=>el.remove()
);


caps.forEach(cap=>{

const left =
(cap.refX/REF_WIDTH)*100;

const top =
(cap.refY/REF_HEIGHT)*100;


/* -------------------------
   WEGGETAUSCHT
------------------------- */

if(isTraded(cap)){

const gone =
document.createElement(
"div"
);

gone.className =
"board-gone";

gone.style.left =
left+"%";

gone.style.top =
top+"%";

wrap.appendChild(
gone
);

return;

}


/* -------------------------
   KLICKBARER KRONKORKEN
------------------------- */

const hotspot =
document.createElement(
"button"
);

hotspot.className =
"cap-hotspot";

hotspot.style.left =
left+"%";

hotspot.style.top =
top+"%";

hotspot.onclick=()=>{

openCap(cap);

};

wrap.appendChild(
hotspot
);


/* -------------------------
   BLAUER HAKEN
------------------------- */

if(isSelected(cap)){

const check =
document.createElement(
"div"
);

check.className =
"board-check";

check.textContent =
"✓";

check.style.left =
left+"%";

check.style.top =
top+"%";

wrap.appendChild(
check
);

}

});

}


/* =========================================
   ANSICHTEN
========================================= */

function showListView(){

document.getElementById(
"normalMain"
).style.display =
"block";

document.getElementById(
"boardView"
).classList.remove(
"active"
);

document.getElementById(
"listViewBtn"
).classList.add(
"active"
);

document.getElementById(
"boardViewBtn"
).classList.remove(
"active"
);

}


function showBoardView(){

document.getElementById(
"normalMain"
).style.display =
"none";

document.getElementById(
"boardView"
).classList.add(
"active"
);

document.getElementById(
"boardViewBtn"
).classList.add(
"active"
);

document.getElementById(
"listViewBtn"
).classList.remove(
"active"
);

buildBoardHotspots();

}


/* =========================================
   DETAIL
========================================= */

function openCap(cap){

if(isTraded(cap)){
return;
}

const container =
document.getElementById(
"detailImage"
);

container.innerHTML="";


const canvas =
document.createElement(
"canvas"
);

drawCap(
canvas,
cap,
500
);

container.appendChild(
canvas
);


document.getElementById(
"detailTitle"
).textContent =
"Nr. "+cap.number;


document.getElementById(
"detailBoard"
).textContent =
"Brett "+cap.board;


const tradeBtn =
document.getElementById(
"tradeBtn"
);


if(isSelected(cap)){

tradeBtn.textContent =
"Aus Tauschliste entfernen";

tradeBtn.classList.add(
"selected"
);

}else{

tradeBtn.textContent =
"Zum Tausch hinzufügen";

tradeBtn.classList.remove(
"selected"
);

}


tradeBtn.onclick=()=>{

toggleTrade(cap);

/*
  sofort wieder zurück
*/

closeModal(
"detailModal"
);

};


document.getElementById(
"detailModal"
).classList.add(
"open"
);

}


/* =========================================
   TAUSCHZÄHLER
========================================= */

function updateTradeCounter(){

document.getElementById(
"tradeHeaderBtn"
).textContent =

"Tausch ("+
tradeSelection.length+
")";

}


/* =========================================
   TAUSCHÜBERSICHT
========================================= */

function openTradeOverview(){

renderTradeOverview();

document.getElementById(
"tradeModal"
).classList.add(
"open"
);

}


function renderTradeOverview(){

const content =
document.getElementById(
"tradeContent"
);

content.innerHTML="";


const selectedCaps =
tradeSelection
.map(number=>

caps.find(
cap=>
cap.number===number
)

)
.filter(
cap=>
cap && !isTraded(cap)
);


if(!selectedCaps.length){

content.innerHTML =
'<div class="trade-empty">'+
'Noch keine Kronkorken ausgewählt.'+
'</div>';

return;

}


const grid =
document.createElement(
"div"
);

grid.className =
"trade-grid";


selectedCaps.forEach(cap=>{

const item =
document.createElement(
"div"
);

item.className =
"trade-item";


const thumb =
document.createElement(
"div"
);

thumb.className =
"trade-thumb";


const canvas =
document.createElement(
"canvas"
);

drawCap(
canvas,
cap,
180
);

thumb.appendChild(
canvas
);


const number =
document.createElement(
"div"
);

number.className =
"trade-item-number";

number.textContent =
"Nr. "+cap.number;


const board =
document.createElement(
"div"
);

board.className =
"trade-item-board";

board.textContent =
"Brett "+cap.board;


const remove =
document.createElement(
"button"
);

remove.className =
"remove-btn";

remove.textContent =
"Entfernen";


remove.onclick=()=>{

tradeSelection =
tradeSelection.filter(
n=>n!==cap.number
);

saveTradeSelection();

renderTradeOverview();

};


item.appendChild(
thumb
);

item.appendChild(
number
);

item.appendChild(
board
);

item.appendChild(
remove
);

grid.appendChild(
item
);

});


content.appendChild(
grid
);


const actions =
document.createElement(
"div"
);

actions.className =
"trade-actions";


const share =
document.createElement(
"button"
);

share.className =
"share-trade-btn";

share.textContent =
"Tauschliste teilen";

share.onclick =
shareTradeSelection;


const clear =
document.createElement(
"button"
);

clear.className =
"clear-trade-btn";

clear.textContent =
"Auswahl leeren";

clear.onclick=()=>{

tradeSelection=[];

saveTradeSelection();

renderTradeOverview();

};


actions.appendChild(
share
);

actions.appendChild(
clear
);

content.appendChild(
actions
);

}


/* =========================================
   TAUSCHLINK
========================================= */

function buildTradeLink(){

const sorted =
[...tradeSelection]
.sort(
(a,b)=>a-b
);

return(

window.location.origin+
window.location.pathname+
"?trade="+
encodeURIComponent(
sorted.join(",")
)

);

}


async function shareTradeSelection(){

if(!tradeSelection.length){
return;
}

const sorted =
[...tradeSelection]
.sort(
(a,b)=>a-b
);

const tradeLink =
buildTradeLink();


const text =

"Meine CapTrade-Auswahl:\n\n"+

sorted
.map(number=>{

const cap =
caps.find(
item=>
item.number===number
);

return(

"Nr. "+
number+
" – Brett "+
cap.board

);

})
.join("\n")

+

"\n\nTauschanfrage öffnen:\n"+
tradeLink;


if(navigator.share){

try{

await navigator.share({

title:
"CapTrade – Tauschanfrage",

text:text

});

}catch(e){}

}

}


/* =========================================
   TAUSCHANFRAGE LESEN
========================================= */

function checkForTradeRequest(){

const params =
new URLSearchParams(
window.location.search
);

const trade =
params.get(
"trade"
);

if(!trade){
return;
}


const numbers =
trade
.split(",")
.map(Number)
.filter(
Number.isInteger
);


const requestedCaps =
numbers
.map(number=>

caps.find(
cap=>
cap.number===number
)

)
.filter(Boolean);


if(!requestedCaps.length){
return;
}

showTradeRequest(
requestedCaps
);

}


/* =========================================
   TAUSCHANFRAGE
========================================= */

function showTradeRequest(
requestedCaps
){

document.getElementById(
"normalMain"
).classList.add(
"hidden"
);

document.getElementById(
"boardView"
).classList.add(
"hidden"
);

document.getElementById(
"viewSwitch"
).classList.add(
"hidden"
);

document.getElementById(
"searchWrap"
).style.display =
"none";

document.getElementById(
"normalHeaderButtons"
).style.display =
"none";


const screen =
document.getElementById(
"requestScreen"
);

screen.classList.add(
"active"
);


document.getElementById(
"requestInfo"
).textContent =

requestedCaps.length+
" Kronkorken ausgewählt";


const grid =
document.getElementById(
"requestGrid"
);

grid.innerHTML="";


requestedCaps.forEach(cap=>{

const item =
document.createElement(
"div"
);

item.className =
"request-item";


const thumb =
document.createElement(
"div"
);

thumb.className =
"request-thumb";


const canvas =
document.createElement(
"canvas"
);

drawCap(
canvas,
cap,
180
);

thumb.appendChild(
canvas
);


const number =
document.createElement(
"div"
);

number.className =
"request-number";

number.textContent =
"Nr. "+cap.number;


const board =
document.createElement(
"div"
);

board.className =
"request-board";

board.textContent =
"Brett "+cap.board;


item.appendChild(
thumb
);

item.appendChild(
number
);

item.appendChild(
board
);

grid.appendChild(
item
);

});

}


/* =========================================
   ZUR HAUPTANSICHT
========================================= */

function backToMain(){

window.location.href =

window.location.origin+
window.location.pathname;

}


/* =========================================
   NORMALES TEILEN
========================================= */

async function sharePage(){

if(navigator.share){

try{

await navigator.share({

title:"CapTrade",

text:
"Schau dir meine Tausch-Kronkorken an:",

url:
window.location.origin+
window.location.pathname

});

}catch(e){}

}

}


/* =========================================
   MODALS
========================================= */

function closeModal(id){

document.getElementById(
id
).classList.remove(
"open"
);

}


function modalBackground(
event,
id
){

if(event.target.id===id){

closeModal(id);

}

}

</script>
