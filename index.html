<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>CapTrade</title>

<style>
:root{
  --bg:#0b1020;
  --panel:#121a2d;
  --panel2:#18233a;
  --line:#273552;
  --text:#f6f8ff;
  --muted:#9aa8c3;
  --blue:#4c8dff;
  --blue2:#2d6eea;
  --red:#ff4e5b;
  --yellow:#f4c84b;
  --green:#38c985;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,input{font:inherit}

.app{
  max-width:1100px;
  margin:auto;
  padding:20px 14px 80px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.brand{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand span{color:var(--red)}

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.topbuttons{
  display:flex;
  gap:8px;
}

.topbtn{
  width:104px;
  height:42px;
  border-radius:13px;
  font-weight:800;
}

.secondary{
  color:white;
  background:var(--panel);
  border:1px solid var(--line);
}

.primary{
  color:white;
  border:0;
  background:linear-gradient(180deg,var(--blue),var(--blue2));
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:14px;
}

.stat{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px;
}

.stat strong{
  display:block;
  font-size:22px;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:14px;
}

.tab{
  white-space:nowrap;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--muted);
  border-radius:999px;
  padding:9px 13px;
  font-weight:800;
}

.tab.active{
  background:var(--blue);
  border-color:var(--blue);
  color:white;
}

.search{
  width:100%;
  padding:12px;
  border-radius:13px;
  border:1px solid var(--line);
  background:var(--panel);
  color:white;
  margin-bottom:14px;
  outline:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

@media(min-width:680px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}

.cap{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
}

.cap.selected{border-color:var(--blue)}
.cap.maybe{border-color:var(--yellow)}

.pic{
  aspect-ratio:1;
  position:relative;
  background:#070c17;
  overflow:hidden;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.badge{
  position:absolute;
  top:7px;
  left:7px;
  background:rgba(0,0,0,.75);
  border-radius:999px;
  padding:5px 8px;
  font-size:11px;
  font-weight:900;
}

.capbody{padding:9px}

.location{
  color:var(--muted);
  font-size:11px;
  margin-bottom:8px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.action{
  border:1px solid var(--line);
  background:#0f1728;
  color:white;
  border-radius:10px;
  padding:8px 3px;
  font-size:11px;
  font-weight:800;
}

.action.on-selected{
  border-color:var(--blue);
  background:rgba(76,141,255,.18);
}

.action.on-maybe{
  border-color:var(--yellow);
  background:rgba(244,200,75,.15);
}

.action.traded{
  grid-column:1/-1;
}

.empty{
  grid-column:1/-1;
  padding:40px 15px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:18px;
}

/* MODAL */

.modalbg{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.72);
  overflow:auto;
  padding:20px 12px;
}

.modalbg.open{display:block}

.modal{
  max-width:650px;
  margin:auto;
  background:#111a2d;
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
}

.modal h2{
  margin:0 0 6px;
}

.info{
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
  margin-bottom:15px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}

.field input{
  width:100%;
  border:1px solid var(--line);
  background:#0c1425;
  color:white;
  border-radius:12px;
  padding:12px;
}

.previewbox{
  display:none;
  margin-top:15px;
}

.previewbox.show{display:block}

.steptext{
  background:#0c1425;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  margin-bottom:10px;
  font-size:13px;
}

#boardCanvas{
  display:block;
  width:100%;
  height:auto;
  border-radius:14px;
  border:1px solid var(--line);
  touch-action:manipulation;
}

.pointbuttons{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.pointbuttons button{
  flex:1;
  border:1px solid var(--line);
  background:var(--panel2);
  color:white;
  border-radius:11px;
  padding:10px;
  font-weight:800;
}

.modalbuttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:16px;
}

.modalbuttons button{
  min-height:44px;
  border-radius:13px;
  font-weight:800;
}

.cancel{
  border:1px solid var(--line);
  background:var(--panel);
  color:white;
}

.import{
  border:0;
  background:var(--blue);
  color:white;
}

.import:disabled{
  opacity:.4;
}

.resetall{
  margin-top:20px;
  width:100%;
  padding:11px;
  border-radius:12px;
  border:1px solid rgba(255,78,91,.45);
  color:#ffb8bd;
  background:rgba(255,78,91,.08);
  font-weight:800;
}

.toast{
  position:fixed;
  left:50%;
  bottom:30px;
  transform:translate(-50%,100px);
  background:white;
  color:#111827;
  padding:10px 15px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
  transition:.25s;
  z-index:200;
}

.toast.show{
  transform:translate(-50%,0);
}
</style>
</head>

<body>

<main class="app">

<header class="topbar">

<div>
  <div class="brand">Cap<span>Trade</span></div>
  <div class="subtitle">Sony‘s Tauschkronkorken</div>
</div>

<div class="topbuttons">
  <button class="topbtn secondary" id="shareBtn">↗ Teilen</button>
  <button class="topbtn primary" id="addBtn">+ Brett</button>
</div>

</header>

<section class="stats">

<div class="stat">
  <strong id="availableCount">0</strong>
  <span>verfügbar</span>
</div>

<div class="stat">
  <strong id="selectedCount">0</strong>
  <span>ausgewählt</span>
</div>

<div class="stat">
  <strong id="maybeCount">0</strong>
  <span>vielleicht</span>
</div>

</section>

<nav class="tabs">
  <button class="tab active" data-filter="all">Alle</button>
  <button class="tab" data-filter="selected">Ausgewählt</button>
  <button class="tab" data-filter="maybe">Vielleicht</button>
  <button class="tab" data-filter="traded">Getauscht</button>
</nav>

<input
  class="search"
  id="search"
  placeholder="Nr. oder Brett suchen …"
>

<section id="grid" class="grid"></section>

</main>


<!-- BRETT IMPORT -->

<div class="modalbg" id="modal">

<div class="modal">

<h2>Brett hinzufügen</h2>

<div class="info">
Wähle dein komplettes Brettfoto aus und markiere anschließend
die <strong>Mitte der vier äußeren Kronkorken</strong>.
</div>

<div class="field">

<label>Brettname</label>

<input
  id="boardName"
  placeholder="z. B. Brett F"
>

</div>

<div class="field">

<label>Brettfoto</label>

<input
  id="boardFile"
  type="file"
  accept="image/*">

</div>


<div class="previewbox" id="previewBox">

<div class="steptext" id="stepText">
1. Tippe auf die Mitte des Kronkorkens oben links.
</div>

<canvas id="boardCanvas"></canvas>

<div class="pointbuttons">

<button id="undoPoint">
↶ Punkt zurück
</button>

<button id="resetPoints">
Punkte löschen
</button>

</div>

</div>


<div class="modalbuttons">

<button class="cancel" id="cancelBtn">
Abbrechen
</button>

<button
  class="import"
  id="importBtn"
  disabled>
Ausschneiden
</button>

</div>

<button class="resetall" id="deleteAll">
Alle bisherigen Test-Kronkorken löschen
</button>

</div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =========================================
   DATENBANK
========================================= */

const DB_NAME = "captrade";
const STORE = "caps";

let db;
let caps = [];
let filter = "all";

function openDB(){

  return new Promise((resolve,reject)=>{

    const req = indexedDB.open(DB_NAME,1);

    req.onupgradeneeded = ()=>{

      const database = req.result;

      if(!database.objectStoreNames.contains(STORE)){

        database.createObjectStore(
          STORE,
          {
            keyPath:"id",
            autoIncrement:true
          }
        );

      }

    };

    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);

  });

}


function getAll(){

  return new Promise((resolve,reject)=>{

    const tx = db.transaction(STORE,"readonly");
    const req = tx.objectStore(STORE).getAll();

    req.onsuccess = ()=>resolve(req.result || []);
    req.onerror = ()=>reject(req.error);

  });

}


function addCap(cap){

  return new Promise((resolve,reject)=>{

    const tx = db.transaction(STORE,"readwrite");
    const req = tx.objectStore(STORE).add(cap);

    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);

  });

}


function saveCap(cap){

  return new Promise((resolve,reject)=>{

    const tx = db.transaction(STORE,"readwrite");
    const req = tx.objectStore(STORE).put(cap);

    req.onsuccess = ()=>resolve();
    req.onerror = ()=>reject(req.error);

  });

}


function clearCaps(){

  return new Promise((resolve,reject)=>{

    const tx = db.transaction(STORE,"readwrite");
    const req = tx.objectStore(STORE).clear();

    req.onsuccess = ()=>resolve();
    req.onerror = ()=>reject(req.error);

  });

}


/* =========================================
   HAUPTANSICHT
========================================= */

function number(id){
  return "#" + String(id).padStart(3,"0");
}


function visibleCaps(){

  const query =
    document
    .getElementById("search")
    .value
    .trim()
    .toLowerCase();


  return caps.filter(cap=>{

    if(
      filter === "all" &&
      cap.status === "traded"
    ) return false;

    if(
      filter === "selected" &&
      cap.status !== "selected"
    ) return false;

    if(
      filter === "maybe" &&
      cap.status !== "maybe"
    ) return false;

    if(
      filter === "traded" &&
      cap.status !== "traded"
    ) return false;


    if(query){

      const text =
        (
          number(cap.id) +
          " " +
          cap.board +
          " " +
          cap.position
        ).toLowerCase();

      if(!text.includes(query)){
        return false;
      }

    }

    return true;

  });

}


function render(){

  document.getElementById("availableCount").textContent =
    caps.filter(c=>c.status !== "traded").length;

  document.getElementById("selectedCount").textContent =
    caps.filter(c=>c.status === "selected").length;

  document.getElementById("maybeCount").textContent =
    caps.filter(c=>c.status === "maybe").length;


  const grid = document.getElementById("grid");
  const list = visibleCaps();


  if(!list.length){

    grid.innerHTML = `
      <div class="empty">
        Noch keine Kronkorken.<br><br>
        Tippe auf <strong>+ Brett</strong>.
      </div>
    `;

    return;

  }


  grid.innerHTML = list.map(cap=>{

    const selected =
      cap.status === "selected";

    const maybe =
      cap.status === "maybe";


    return `

      <article class="cap ${selected ? "selected":""} ${maybe ? "maybe":""}">

        <div class="pic">

          <img src="${cap.image}">

          <div class="badge">
            ${number(cap.id)}
          </div>

        </div>


        <div class="capbody">

          <div class="location">
            ${cap.board} · Pos. ${cap.position}
          </div>


          <div class="actions">

            <button
              class="action ${selected ? "on-selected":""}"
              data-id="${cap.id}"
              data-status="selected">

              ${selected ? "✓ Ausgewählt":"Auswählen"}

            </button>


            <button
              class="action ${maybe ? "on-maybe":""}"
              data-id="${cap.id}"
              data-status="maybe">

              ${maybe ? "★ Vielleicht":"Vielleicht"}

            </button>


            <button
              class="action traded"
              data-id="${cap.id}"
              data-status="traded">

              Getauscht

            </button>

          </div>

        </div>

      </article>

    `;

  }).join("");

}


async function reload(){

  caps = await getAll();

  caps.sort(
    (a,b)=>a.id-b.id
  );

  render();

}


/* =========================================
   FILTER
========================================= */

document
.querySelectorAll(".tab")
.forEach(button=>{

  button.addEventListener("click",()=>{

    document
    .querySelectorAll(".tab")
    .forEach(item=>item.classList.remove("active"));

    button.classList.add("active");

    filter =
      button.dataset.filter;

    render();

  });

});


document
.getElementById("search")
.addEventListener(
  "input",
  render
);


/* =========================================
   STATUS
========================================= */

document
.getElementById("grid")
.addEventListener(
"click",
async event=>{

  const button =
    event.target.closest("[data-status]");

  if(!button) return;


  const id =
    Number(button.dataset.id);

  const status =
    button.dataset.status;


  const cap =
    caps.find(item=>item.id === id);

  if(!cap) return;


  if(
    cap.status === status &&
    status !== "traded"
  ){

    cap.status = "available";

  }else{

    cap.status = status;

  }


  await saveCap(cap);
  await reload();

});


/* =========================================
   MODAL
========================================= */

const modal =
  document.getElementById("modal");


document
.getElementById("addBtn")
.addEventListener(
"click",
()=>{

  modal.classList.add("open");

});


document
.getElementById("cancelBtn")
.addEventListener(
"click",
()=>{

  modal.classList.remove("open");

});


/* =========================================
   FOTO LADEN
========================================= */

const canvas =
  document.getElementById("boardCanvas");

const ctx =
  canvas.getContext("2d");

let boardImage = null;

let points = [];


/*
Punkte werden in dieser Reihenfolge gesetzt:

0 = oben links
1 = oben rechts
2 = unten rechts
3 = unten links
*/

const instructions = [

  "1. Tippe auf die Mitte des Kronkorkens oben links.",

  "2. Jetzt auf die Mitte des Kronkorkens oben rechts.",

  "3. Jetzt auf die Mitte des Kronkorkens unten rechts.",

  "4. Jetzt auf die Mitte des Kronkorkens unten links.",

  "Perfekt. Alle vier Punkte sind gesetzt."

];


function fileToDataURL(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload =
      ()=>resolve(reader.result);

    reader.onerror =
      reject;

    reader.readAsDataURL(file);

  });

}


function loadImage(dataURL){

  return new Promise((resolve,reject)=>{

    const image =
      new Image();

    image.onload =
      ()=>resolve(image);

    image.onerror =
      reject;

    image.src =
      dataURL;

  });

}


document
.getElementById("boardFile")
.addEventListener(
"change",
async event=>{

  const file =
    event.target.files[0];

  if(!file) return;


  const dataURL =
    await fileToDataURL(file);

  boardImage =
    await loadImage(dataURL);


  /*
  Canvas nutzt intern die echte Fotoauflösung.
  Dadurch bleiben die Klickpunkte exakt.
  */

  canvas.width =
    boardImage.width;

  canvas.height =
    boardImage.height;


  points = [];

  document
  .getElementById("previewBox")
  .classList.add("show");


  drawPreview();

  updateStep();

});


/* =========================================
   PUNKTE SETZEN
========================================= */

canvas.addEventListener(
"click",
event=>{

  if(!boardImage) return;

  if(points.length >= 4){
    return;
  }


  const rect =
    canvas.getBoundingClientRect();


  const scaleX =
    canvas.width / rect.width;

  const scaleY =
    canvas.height / rect.height;


  const x =
    (event.clientX - rect.left) *
    scaleX;

  const y =
    (event.clientY - rect.top) *
    scaleY;


  points.push({x,y});


  drawPreview();

  updateStep();

});


function updateStep(){

  document
  .getElementById("stepText")
  .textContent =
    instructions[
      Math.min(
        points.length,
        4
      )
    ];


  document
  .getElementById("importBtn")
  .disabled =
    points.length !== 4;

}


function drawPreview(){

  if(!boardImage) return;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.drawImage(
    boardImage,
    0,
    0
  );


  const radius =
    Math.max(
      12,
      canvas.width * 0.012
    );


  points.forEach(
  (point,index)=>{

    ctx.beginPath();

    ctx.arc(
      point.x,
      point.y,
      radius,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "rgba(76,141,255,.9)";

    ctx.fill();


    ctx.lineWidth =
      Math.max(
        3,
        canvas.width * .003
      );

    ctx.strokeStyle =
      "white";

    ctx.stroke();


    ctx.fillStyle =
      "white";

    ctx.font =
      `bold ${radius}px Arial`;

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "middle";

    ctx.fillText(
      String(index + 1),
      point.x,
      point.y
    );

  });


  if(points.length === 4){

    ctx.beginPath();

    ctx.moveTo(
      points[0].x,
      points[0].y
    );

    ctx.lineTo(
      points[1].x,
      points[1].y
    );

    ctx.lineTo(
      points[2].x,
      points[2].y
    );

    ctx.lineTo(
      points[3].x,
      points[3].y
    );

    ctx.closePath();


    ctx.lineWidth =
      Math.max(
        3,
        canvas.width * .003
      );

    ctx.strokeStyle =
      "#4c8dff";

    ctx.stroke();

  }

}


document
.getElementById("undoPoint")
.addEventListener(
"click",
()=>{

  points.pop();

  drawPreview();

  updateStep();

});


document
.getElementById("resetPoints")
.addEventListener(
"click",
()=>{

  points = [];

  drawPreview();

  updateStep();

});


/* =========================================
   PERSPEKTIVISCHES RASTER
========================================= */

/*
Bilineare Interpolation innerhalb
der vier gesetzten Eckpunkte.
*/

function gridPoint(u,v){

  const TL = points[0];
  const TR = points[1];
  const BR = points[2];
  const BL = points[3];


  const x =
    (1-u)*(1-v)*TL.x +
    u*(1-v)*TR.x +
    u*v*BR.x +
    (1-u)*v*BL.x;


  const y =
    (1-u)*(1-v)*TL.y +
    u*(1-v)*TR.y +
    u*v*BR.y +
    (1-u)*v*BL.y;


  return {x,y};

}


/*
Abstand zweier Punkte.
*/

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


/* =========================================
   140 KRONKORKEN AUSSCHNEIDEN
========================================= */

async function createCaps(){

  const COLS = 10;
  const ROWS = 14;

  const results = [];


  for(
    let row=0;
    row<ROWS;
    row++
  ){

    for(
      let col=0;
      col<COLS;
      col++
    ){

      /*
      Da die 4 angeklickten Punkte bereits
      die MITTEN der äußeren Kronkorken sind:

      Spalte 0 = u 0
      Spalte 9 = u 1

      Reihe 0 = v 0
      Reihe 13 = v 1
      */

      const u =
        col / (COLS-1);

      const v =
        row / (ROWS-1);


      const center =
        gridPoint(u,v);


      /*
      Lokale Abstände zu Nachbarpositionen.
      Dadurch werden die Ausschnitte unten
      automatisch etwas größer, falls das
      Brett perspektivisch größer wird.
      */

      const leftU =
        Math.max(
          0,
          (col-1)/(COLS-1)
        );

      const rightU =
        Math.min(
          1,
          (col+1)/(COLS-1)
        );

      const upV =
        Math.max(
          0,
          (row-1)/(ROWS-1)
        );

      const downV =
        Math.min(
          1,
          (row+1)/(ROWS-1)
        );


      const left =
        gridPoint(leftU,v);

      const right =
        gridPoint(rightU,v);

      const up =
        gridPoint(u,upV);

      const down =
        gridPoint(u,downV);


      let horizontal =
        distance(left,right);

      let vertical =
        distance(up,down);


      if(col>0 && col<COLS-1){
        horizontal /= 2;
      }

      if(row>0 && row<ROWS-1){
        vertical /= 2;
      }


      /*
      84 % des kleineren Rasterabstands.
      So bleibt etwas Luft um den Kronkorken.
      */

      const size =
        Math.min(
          horizontal,
          vertical
        ) * 0.84;


      const output =
        document.createElement("canvas");


      output.width = 260;
      output.height = 260;


      const outputCtx =
        output.getContext("2d");


      outputCtx.fillStyle =
        "#ffffff";


      outputCtx.fillRect(
        0,
        0,
        260,
        260
      );


      outputCtx.drawImage(

        boardImage,

        center.x - size/2,
        center.y - size/2,

        size,
        size,

        0,
        0,

        260,
        260

      );


      results.push(

        output.toDataURL(
          "image/jpeg",
          .88
        )

      );

    }

  }


  return results;

}


/* =========================================
   IMPORTIEREN
========================================= */

document
.getElementById("importBtn")
.addEventListener(
"click",
async ()=>{

  const board =
    document
    .getElementById("boardName")
    .value
    .trim();


  if(!board){

    alert(
      "Bitte zuerst einen Brettnamen eingeben."
    );

    return;

  }


  if(!boardImage){

    alert(
      "Bitte ein Brettfoto auswählen."
    );

    return;

  }


  if(points.length !== 4){

    alert(
      "Bitte zuerst alle vier Eck-Kronkorken markieren."
    );

    return;

  }


  const button =
    document.getElementById("importBtn");


  button.disabled = true;
  button.textContent = "Schneide Brett …";


  try{

    const images =
      await createCaps();


    for(
      let i=0;
      i<images.length;
      i++
    ){

      button.textContent =
        `Speichere ${i+1}/140`;


      await addCap({

        board,

        position:i+1,

        image:images[i],

        status:"available",

        createdAt:Date.now()

      });

    }


    await reload();


    modal.classList.remove("open");


    showToast(
      "140 Kronkorken erstellt"
    );

  }
  catch(error){

    console.error(error);

    alert(
      "Beim Ausschneiden ist etwas schiefgelaufen."
    );

  }
  finally{

    button.disabled = false;

    button.textContent =
      "Ausschneiden";

  }

});

/* =========================================
   TOAST
========================================= */

function showToast(text){

  const toast =
    document.getElementById("toast");


  toast.textContent =
    text;


  toast.classList.add("show");


  setTimeout(
    ()=>toast.classList.remove("show"),
    1800
  );

}
