<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>CapTrade</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f3f4f6;
  color: #111827;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #111827;
  color: white;
  padding: 16px;
  box-shadow: 0 2px 10px rgba(0,0,0,.15);
}

.header-inner {
  max-width: 900px;
  margin: auto;
}

.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

h1 {
  margin: 0;
  font-size: 26px;
}

.subtitle {
  margin-top: 3px;
  color: #cbd5e1;
  font-size: 13px;
}

.share-btn {
  border: 0;
  background: white;
  color: #111827;
  font-weight: 700;
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
}

.search-wrap {
  margin-top: 14px;
}

#search {
  width: 100%;
  padding: 12px 14px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 16px;
}

.info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 14px;
  font-size: 14px;
  color: #4b5563;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.cap-card {
  background: white;
  border: 0;
  border-radius: 14px;
  padding: 9px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  cursor: pointer;
  text-align: center;
}

.cap-card:active {
  transform: scale(.97);
}

.thumb {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  overflow: hidden;
  background: #e5e7eb;
  margin-bottom: 7px;
}

.thumb canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.cap-number {
  font-weight: 800;
  font-size: 15px;
}

.cap-board {
  font-size: 12px;
  color: #6b7280;
  margin-top: 2px;
}

/* MODAL */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.72);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal.open {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 500px;
  max-height: 92vh;
  overflow: auto;
  background: white;
  border-radius: 20px;
  position: relative;
  padding: 20px;
}

.close {
  position: absolute;
  right: 12px;
  top: 12px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 0;
  font-size: 24px;
  background: #f3f4f6;
  cursor: pointer;
  z-index: 5;
}

.detail-image {
  width: 220px;
  height: 220px;
  max-width: 72vw;
  max-height: 72vw;
  margin: 18px auto 12px;
  border-radius: 50%;
  overflow: hidden;
  background: #e5e7eb;
}

.detail-image canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.detail-title {
  font-size: 24px;
  font-weight: 800;
  text-align: center;
}

.detail-board {
  text-align: center;
  color: #6b7280;
  margin-top: 4px;
  font-size: 16px;
}

.main-btn {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  margin-top: 18px;
  background: #111827;
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

/* BRETT */

.board-wrapper {
  position: relative;
  width: 100%;
  margin-top: 14px;
  border-radius: 12px;
  overflow: hidden;
}

.board-wrapper img {
  display: block;
  width: 100%;
  height: auto;
}

.marker {
  position: absolute;
  width: 9%;
  aspect-ratio: 1;
  border: 4px solid red;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow:
    0 0 0 3px white,
    0 0 18px red;
  animation: pulse 1s infinite alternate;
  pointer-events: none;
}

@keyframes pulse {
  from {
    transform: translate(-50%, -50%) scale(.9);
  }

  to {
    transform: translate(-50%, -50%) scale(1.15);
  }
}

.board-head {
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  margin-top: 5px;
}

.board-note {
  text-align: center;
  color: #6b7280;
  font-size: 14px;
  margin-top: 4px;
}

.empty {
  text-align: center;
  padding: 40px 10px;
  color: #6b7280;
  grid-column: 1 / -1;
}

@media (min-width: 600px) {

  .grid {
    grid-template-columns: repeat(5, 1fr);
  }

}
</style>
</head>

<body>

<header>

<div class="header-inner">

  <div class="title-row">

    <div>
      <h1>CapTrade</h1>
      <div class="subtitle">
        Meine Tausch-Kronkorken
      </div>
    </div>

    <button
      class="share-btn"
      onclick="sharePage()">
      Teilen
    </button>

  </div>

  <div class="search-wrap">

    <input
      id="search"
      type="search"
      placeholder="Nummer oder Brett suchen …"
      oninput="renderCaps()">

  </div>

</div>

</header>


<main>

  <div class="info">

    <span id="count"></span>

    <span>Brett F</span>

  </div>

  <div
    id="grid"
    class="grid">
  </div>

</main>


<!-- DETAIL -->

<div
  id="detailModal"
  class="modal"
  onclick="modalBackground(event,'detailModal')">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal('detailModal')">
      ×
    </button>

    <div
      id="detailImage"
      class="detail-image">
    </div>

    <div
      id="detailTitle"
      class="detail-title">
    </div>

    <div
      id="detailBoard"
      class="detail-board">
    </div>

    <button
      id="showBoardBtn"
      class="main-btn">
      Auf Brett anzeigen
    </button>

  </div>

</div>


<!-- BRETTÜBERSICHT -->

<div
  id="boardModal"
  class="modal"
  onclick="modalBackground(event,'boardModal')">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal('boardModal')">
      ×
    </button>

    <div
      id="boardHead"
      class="board-head">
      Brett F
    </div>

    <div
      id="boardNote"
      class="board-note">
    </div>

    <div class="board-wrapper">

      <img
        id="boardImage"
        src="IMG_6469.jpeg"
        alt="Brett F">

      <div
        id="marker"
        class="marker">
      </div>

    </div>

  </div>

</div>


<script>

/* ==========================================
   CAPTRADE
   TESTBRETT F
   ========================================== */


/*
   DEIN BILD AUF GITHUB
*/

const IMAGE = "IMG_6469.jpeg";


/*
   Brettbezeichnung
*/

const BOARD = "F";


/*
   Nummer des ersten Kronkorkens.

   Später können wir hier z.B.
   501 eintragen, wenn Brett F
   bei Nr. 501 beginnen soll.
*/

const START_NUMMER = 1;


/*
   Originalgröße des Fotos
*/

const ORIGINAL_WIDTH = 1152;
const ORIGINAL_HEIGHT = 1536;


/*
   Mittelpunkt der 10 Spalten
*/

const COL_X = [

  94,
  195,
  295,
  399,
  503,
  607,
  722,
  829,
  939,
  1049

];


/*
   Mittelpunkt der 14 Reihen
*/

const ROW_Y = [

  81,
  173,
  264,
  370,
  468,
  561,
  675,
  780,
  896,
  995,
  1107,
  1225,
  1322,
  1433

];


/*
   Ausschnittgröße eines Kronkorkens
*/

const CROP_SIZE = 92;


/* ==========================================
   KRONKORKEN ERZEUGEN
   ========================================== */

const caps = [];

let runningNumber = START_NUMMER;


ROW_Y.forEach((y,rowIndex) => {

  COL_X.forEach((x,colIndex) => {

    caps.push({

      number: runningNumber,

      board: BOARD,

      row: rowIndex + 1,

      position: colIndex + 1,

      x: x,

      y: y

    });

    runningNumber++;

  });

});


/* ==========================================
   ORIGINALBILD LADEN
   ========================================== */

const sourceImage = new Image();

sourceImage.src = IMAGE;


sourceImage.onload = () => {

  renderCaps();

  openFromURL();

};


sourceImage.onerror = () => {

  document.getElementById("grid").innerHTML =
    '<div class="empty">' +
    'Das Bild IMG_6469.jpeg konnte nicht geladen werden.' +
    '</div>';

};


/* ==========================================
   KRONKORKEN AUSSCHNEIDEN
   ========================================== */

function drawCap(
  canvas,
  cap,
  outputSize = 180
) {

  const ctx =
    canvas.getContext("2d");


  canvas.width =
    outputSize;

  canvas.height =
    outputSize;


  const sx =
    cap.x - CROP_SIZE / 2;

  const sy =
    cap.y - CROP_SIZE / 2;


  ctx.clearRect(
    0,
    0,
    outputSize,
    outputSize
  );


  ctx.drawImage(

    sourceImage,

    sx,
    sy,

    CROP_SIZE,
    CROP_SIZE,

    0,
    0,

    outputSize,
    outputSize

  );

}


/* ==========================================
   LISTE ANZEIGEN
   ========================================== */

function renderCaps() {

  if (!sourceImage.complete) {
    return;
  }


  const grid =
    document.getElementById("grid");


  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  grid.innerHTML = "";


  const filtered =
    caps.filter(cap => {

      if (!search) {
        return true;
      }


      return (

        String(cap.number)
          .includes(search)

        ||

        ("brett " + cap.board)
          .toLowerCase()
          .includes(search)

        ||

        cap.board
          .toLowerCase()
          .includes(search)

      );

    });


  document
    .getElementById("count")
    .textContent =
      filtered.length +
      " Kronkorken";


  if (!filtered.length) {

    grid.innerHTML =
      '<div class="empty">' +
      'Keine Kronkorken gefunden.' +
      '</div>';

    return;

  }


  filtered.forEach(cap => {

    const card =
      document.createElement("button");


    card.className =
      "cap-card";


    const thumb =
      document.createElement("div");


    thumb.className =
      "thumb";


    const canvas =
      document.createElement("canvas");


    drawCap(
      canvas,
      cap,
      180
    );


    thumb.appendChild(
      canvas
    );


    const number =
      document.createElement("div");


    number.className =
      "cap-number";


    number.textContent =
      "Nr. " +
      cap.number;


    const board =
      document.createElement("div");


    board.className =
      "cap-board";


    board.textContent =
      "Brett " +
      cap.board;


    card.appendChild(
      thumb
    );

    card.appendChild(
      number
    );

    card.appendChild(
      board
    );


    card.onclick = () => {

      openCap(cap);

    };


    grid.appendChild(
      card
    );

  });

}


/* ==========================================
   DETAILANSICHT
   ========================================== */

function openCap(cap) {

  const container =
    document
      .getElementById(
        "detailImage"
      );


  container.innerHTML = "";


  const canvas =
    document.createElement(
      "canvas"
    );


  drawCap(
    canvas,
    cap,
    400
  );


  container.appendChild(
    canvas
  );


  document
    .getElementById(
      "detailTitle"
    )
    .textContent =
      "Nr. " +
      cap.number;


  document
    .getElementById(
      "detailBoard"
    )
    .textContent =
      "Brett " +
      cap.board;


  document
    .getElementById(
      "showBoardBtn"
    )
    .onclick = () => {

      closeModal(
        "detailModal"
      );

      showOnBoard(
        cap
      );

    };


  document
    .getElementById(
      "detailModal"
    )
    .classList
    .add("open");


  history.replaceState(
    null,
    "",
    "#cap=" +
    cap.number
  );

}


/* ==========================================
   AUF BRETT ANZEIGEN
   ========================================== */

function showOnBoard(cap) {

  const marker =
    document
      .getElementById(
        "marker"
      );


  const left =
    (cap.x /
    ORIGINAL_WIDTH)
    * 100;


  const top =
    (cap.y /
    ORIGINAL_HEIGHT)
    * 100;


  marker.style.left =
    left + "%";


  marker.style.top =
    top + "%";


  document
    .getElementById(
      "boardNote"
    )
    .textContent =

      "Nr. " +
      cap.number +

      " · Reihe " +
      cap.row +

      " · Position " +
      cap.position;


  document
    .getElementById(
      "boardModal"
    )
    .classList
    .add("open");

}


/* ==========================================
   FENSTER SCHLIESSEN
   ========================================== */

function closeModal(id) {

  document
    .getElementById(id)
    .classList
    .remove("open");

}


function modalBackground(
  event,
  id
) {

  if (
    event.target.id === id
  ) {

    closeModal(id);

  }

}


/* ==========================================
   TEILEN
   ========================================== */

async function sharePage() {

  const data = {

    title:
      "CapTrade",

    text:
      "Schau dir meine Tausch-Kronkorken an:",

    url:
      window.location.href

  };


  if (navigator.share) {

    try {

      await navigator.share(
        data
      );

    }

    catch (e) {}

  }

  else {

    await navigator
      .clipboard
      .writeText(
        window.location.href
      );


    alert(
      "Link wurde kopiert."
    );

  }

}


/* ==========================================
   DIREKTLINK
   ========================================== */

function openFromURL() {

  const hash =
    window.location.hash;


  if (
    !hash.startsWith(
      "#cap="
    )
  ) {

    return;

  }


  const number =
    Number(

      hash.replace(
        "#cap=",
        ""
      )

    );


  const cap =
    caps.find(

      item =>
        item.number ===
        number

    );


  if (cap) {

    openCap(cap);

  }

}

</script>

</body>
</html>
