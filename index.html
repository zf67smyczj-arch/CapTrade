<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">

<title>CapTrade</title>

<style>
:root{
  --bg:#0b1020;
  --panel:#121a2d;
  --panel2:#18233a;
  --line:#273552;
  --text:#f6f8ff;
  --muted:#9aa8c3;
  --blue:#4c8dff;
  --blue2:#2d6eea;
  --red:#ff4e5b;
  --yellow:#f4c84b;
  --green:#38c985;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(1100px,100%);
  margin:auto;
  padding:20px 14px 80px;
}

/* HEADER */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.brand{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand span{
  color:var(--red);
}

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.topbuttons{
  display:flex;
  gap:8px;
}

.btn{
  height:42px;
  width:104px;
  border-radius:13px;
  font-weight:800;
}

.btn-secondary{
  background:var(--panel);
  color:white;
  border:1px solid var(--line);
}

.btn-primary{
  border:0;
  color:white;
  background:linear-gradient(180deg,var(--blue),var(--blue2));
}

/* STATISTIK */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:14px;
}

.stat{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px;
}

.stat-number{
  font-size:22px;
  font-weight:900;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
}

/* FILTER */

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:14px;
}

.tab{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--muted);
  padding:9px 13px;
  border-radius:999px;
  font-weight:800;
  white-space:nowrap;
}

.tab.active{
  background:var(--blue);
  border-color:var(--blue);
  color:white;
}

/* SUCHE */

.search{
  width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  color:white;
  border-radius:13px;
  padding:12px;
  margin-bottom:14px;
  outline:none;
}

/* KRONKORKEN */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

@media(min-width:680px){
  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

.cap{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
}

.cap.selected{
  border-color:var(--blue);
}

.cap.maybe{
  border-color:var(--yellow);
}

.image-wrap{
  aspect-ratio:1/1;
  background:#080d18;
  position:relative;
}

.cap-image{
  width:100%;
  height:100%;
  object-fit:cover;
}

.number{
  position:absolute;
  top:7px;
  left:7px;
  background:rgba(0,0,0,.72);
  padding:5px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
}

.cap-body{
  padding:9px;
}

.location{
  font-size:11px;
  color:var(--muted);
  margin-bottom:8px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.action{
  border:1px solid var(--line);
  background:#0f1728;
  color:white;
  border-radius:10px;
  padding:8px 4px;
  font-size:11px;
  font-weight:800;
}

.action.selected{
  border-color:var(--blue);
  background:rgba(76,141,255,.18);
}

.action.maybe{
  border-color:var(--yellow);
  background:rgba(244,200,75,.15);
}

.action.traded{
  grid-column:1/-1;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  border:1px dashed var(--line);
  border-radius:18px;
  padding:40px 15px;
  color:var(--muted);
}

/* MODAL */

.modal-background{
  position:fixed;
  inset:0;
  display:none;
  background:rgba(0,0,0,.7);
  z-index:100;
  align-items:flex-end;
}

.modal-background.open{
  display:flex;
}

.modal{
  width:100%;
  background:#111a2d;
  border-radius:22px 22px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));
}

.modal h2{
  margin:0 0 6px;
}

.modal-info{
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
  margin-bottom:18px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:12px;
  font-weight:800;
}

.field input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#0c1425;
  color:white;
}

.filebox{
  background:#0c1425;
  border:1px dashed #405477;
  border-radius:14px;
  padding:16px;
}

.modal-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:18px;
}

.modal-buttons button{
  height:44px;
  border-radius:13px;
  font-weight:800;
}

.cancel{
  background:var(--panel);
  border:1px solid var(--line);
  color:white;
}

.import{
  background:var(--blue);
  border:0;
  color:white;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translate(-50%,100px);
  background:white;
  color:#111827;
  border-radius:999px;
  padding:10px 15px;
  font-weight:800;
  font-size:13px;
  transition:.25s;
  z-index:200;
}

.toast.show{
  transform:translate(-50%,0);
}

</style>
</head>

<body>

<main class="app">

<header class="topbar">

<div>
  <div class="brand">
    Cap<span>Trade</span>
  </div>

  <div class="subtitle">
    Sony‘s Tauschkronkorken
  </div>
</div>

<div class="topbuttons">

<button
  class="btn btn-secondary"
  id="shareButton">
  ↗ Teilen
</button>

<button
  class="btn btn-primary"
  id="addBoardButton">
  + Brett
</button>

</div>

</header>


<section class="stats">

<div class="stat">
  <div class="stat-number" id="availableCount">0</div>
  <div class="stat-label">verfügbar</div>
</div>

<div class="stat">
  <div class="stat-number" id="selectedCount">0</div>
  <div class="stat-label">ausgewählt</div>
</div>

<div class="stat">
  <div class="stat-number" id="maybeCount">0</div>
  <div class="stat-label">vielleicht</div>
</div>

</section>


<nav class="tabs">

<button class="tab active" data-filter="all">
Alle
</button>

<button class="tab" data-filter="selected">
Ausgewählt
</button>

<button class="tab" data-filter="maybe">
Vielleicht
</button>

<button class="tab" data-filter="traded">
Getauscht
</button>

</nav>


<input
  id="search"
  class="search"
  placeholder="Nr. oder Brett suchen …"
>


<section
  class="grid"
  id="grid">
</section>

</main>


<!-- BRETT IMPORT -->

<div
  class="modal-background"
  id="boardModal">

<div class="modal">

<h2>
Brett hinzufügen
</h2>

<div class="modal-info">
Ein komplettes Brettfoto auswählen.
CapTrade teilt es automatisch in
<strong>10 Spalten × 14 Reihen</strong>
und erstellt daraus 140 einzelne Kronkorken.
</div>


<div class="field">

<label>
Brettname
</label>

<input
  id="boardName"
  placeholder="z. B. Brett A"
>

</div>


<div class="field">

<label>
Brettfoto
</label>

<div class="filebox">

<input
  id="boardImage"
  type="file"
  accept="image/*">

</div>

</div>


<div class="modal-buttons">

<button
  class="cancel"
  id="cancelButton">
Abbrechen
</button>

<button
  class="import"
  id="importButton">
Importieren
</button>

</div>

</div>

</div>


<div
  class="toast"
  id="toast">
</div>


<script>

/* =========================
   DATENBANK
========================= */

const DB_NAME = "captrade";
const STORE_NAME = "caps";

let db;
let caps = [];
let currentFilter = "all";


function openDatabase(){

return new Promise((resolve,reject)=>{

const request =
indexedDB.open(DB_NAME,1);

request.onupgradeneeded = function(){

const database =
request.result;

if(
!database.objectStoreNames.contains(
STORE_NAME
)
){

database.createObjectStore(
STORE_NAME,
{
keyPath:"id",
autoIncrement:true
}
);

}

};

request.onsuccess = function(){

resolve(
request.result
);

};

request.onerror = function(){

reject(
request.error
);

};

});

}


function getAllCaps(){

return new Promise((resolve,reject)=>{

const transaction =
db.transaction(
STORE_NAME,
"readonly"
);

const store =
transaction.objectStore(
STORE_NAME
);

const request =
store.getAll();

request.onsuccess =
()=>resolve(
request.result || []
);

request.onerror =
()=>reject(
request.error
);

});

}


function addCap(cap){

return new Promise((resolve,reject)=>{

const transaction =
db.transaction(
STORE_NAME,
"readwrite"
);

const request =
transaction
.objectStore(STORE_NAME)
.add(cap);

request.onsuccess =
()=>resolve(
request.result
);

request.onerror =
()=>reject(
request.error
);

});

}


function updateCap(cap){

return new Promise((resolve,reject)=>{

const transaction =
db.transaction(
STORE_NAME,
"readwrite"
);

const request =
transaction
.objectStore(STORE_NAME)
.put(cap);

request.onsuccess =
()=>resolve();

request.onerror =
()=>reject(
request.error
);

});

}


/* =========================
   BILDER
========================= */

function fileToDataURL(file){

return new Promise(
(resolve,reject)=>{

const reader =
new FileReader();

reader.onload =
()=>resolve(
reader.result
);

reader.onerror =
reject;

reader.readAsDataURL(
file
);

});

}


function loadImage(dataURL){

return new Promise(
(resolve,reject)=>{

const image =
new Image();

image.onload =
()=>resolve(image);

image.onerror =
reject;

image.src =
dataURL;

});

}


/* =========================
   BRETT AUSSCHNEIDEN
========================= */

async function splitBoard(file){

const dataURL =
await fileToDataURL(file);

const image =
await loadImage(dataURL);


/*
TESTBRETT:

10 Spalten
14 Reihen

Diese Werte können wir später
noch fein anpassen.
*/

const columns = 10;
const rows = 14;


/*
Rand des Kronkorken-Rasters
innerhalb des Fotos.
*/

const leftPercent = 0.055;
const rightPercent = 0.965;

const topPercent = 0.02;
const bottomPercent = 0.985;


const startX =
image.width *
leftPercent;

const startY =
image.height *
topPercent;


const gridWidth =
image.width *
(
rightPercent -
leftPercent
);

const gridHeight =
image.height *
(
bottomPercent -
topPercent
);


const cellWidth =
gridWidth /
columns;

const cellHeight =
gridHeight /
rows;


const images = [];


for(
let row = 0;
row < rows;
row++
){

for(
let column = 0;
column < columns;
column++
){

const centerX =
startX +
(column + 0.5) *
cellWidth;


const centerY =
startY +
(row + 0.5) *
cellHeight;


/*
Quadratischer Ausschnitt.

Etwas kleiner als das Rasterfeld,
damit möglichst kein Nachbar-
Kronkorken mit im Bild landet.
*/

const size =
Math.min(
cellWidth,
cellHeight
) * 0.92;


const sourceX =
centerX -
size / 2;

const sourceY =
centerY -
size / 2;


const canvas =
document.createElement(
"canvas"
);


canvas.width = 260;
canvas.height = 260;


const context =
canvas.getContext(
"2d"
);


context.fillStyle =
"#ffffff";


context.fillRect(
0,
0,
260,
260
);


context.drawImage(
image,

sourceX,
sourceY,
size,
size,

0,
0,
260,
260
);


images.push(

canvas.toDataURL(
"image/jpeg",
0.86
)

);

}

}


return images;

}


/* =========================
   ANZEIGE
========================= */

function capNumber(id){

return "#" +
String(id)
.padStart(
3,
"0"
);

}


function showToast(text){

const toast =
document.getElementById(
"toast"
);

toast.textContent =
text;

toast.classList.add(
"show"
);

setTimeout(
()=>{

toast.classList.remove(
"show"
);

},
1800
);

}


function filteredCaps(){

const search =
document
.getElementById("search")
.value
.toLowerCase()
.trim();


return caps.filter(cap=>{

if(
currentFilter === "all" &&
cap.status === "traded"
){

return false;

}


if(
currentFilter === "selected" &&
cap.status !== "selected"
){

return false;

}


if(
currentFilter === "maybe" &&
cap.status !== "maybe"
){

return false;

}


if(
currentFilter === "traded" &&
cap.status !== "traded"
){

return false;

}


if(search){

const text =
(
capNumber(cap.id) +
" " +
cap.board +
" " +
cap.position
)
.toLowerCase();


if(
!text.includes(search)
){

return false;

}

}


return true;

});

}


function render(){

const grid =
document.getElementById(
"grid"
);


document.getElementById(
"availableCount"
).textContent =

caps.filter(
cap =>
cap.status !== "traded"
).length;


document.getElementById(
"selectedCount"
).textContent =

caps.filter(
cap =>
cap.status === "selected"
).length;


document.getElementById(
"maybeCount"
).textContent =

caps.filter(
cap =>
cap.status === "maybe"
).length;


const list =
filteredCaps();


if(
list.length === 0
){

grid.innerHTML = `

<div class="empty">

<strong>
Noch keine Kronkorken
</strong>

<br><br>

Tippe oben auf
<strong>+ Brett</strong>
und lade dein Testbrett hoch.

</div>

`;

return;

}


grid.innerHTML =

list.map(cap=>{

const selected =
cap.status ===
"selected";

const maybe =
cap.status ===
"maybe";


return `

<article
class="
cap
${selected ? "selected" : ""}
${maybe ? "maybe" : ""}
">

<div class="image-wrap">

<img
class="cap-image"
src="${cap.image}"
>

<div class="number">
${capNumber(cap.id)}
</div>

</div>


<div class="cap-body">

<div class="location">

${cap.board}
· Pos. ${cap.position}

</div>


<div class="actions">


<button
class="
action
${selected ? "selected" : ""}
"
data-id="${cap.id}"
data-status="selected"
>

${selected
? "✓ Ausgewählt"
: "Auswählen"}

</button>


<button
class="
action
${maybe ? "maybe" : ""}
"
data-id="${cap.id}"
data-status="maybe"
>

${maybe
? "★ Vielleicht"
: "Vielleicht"}

</button>


<button
class="action traded"
data-id="${cap.id}"
data-status="traded"
>

Getauscht

</button>


</div>

</div>

</article>

`;

}).join("");

}


/* =========================
   + BRETT
========================= */

const modal =
document.getElementById(
"boardModal"
);


document
.getElementById(
"addBoardButton"
)
.addEventListener(
"click",
function(){

modal.classList.add(
"open"
);

}
);


document
.getElementById(
"cancelButton"
)
.addEventListener(
"click",
function(){

modal.classList.remove(
"open"
);

}
);


modal.addEventListener(
"click",
function(event){

if(
event.target === modal
){

modal.classList.remove(
"open"
);

}

}
);


/* =========================
   IMPORT
========================= */

document
.getElementById(
"importButton"
)
.addEventListener(
"click",
async function(){

const boardName =
document
.getElementById(
"boardName"
)
.value
.trim();


const file =
document
.getElementById(
"boardImage"
)
.files[0];


if(
!boardName
){

alert(
"Bitte gib einen Brettnamen ein."
);

return;

}


if(
!file
){

alert(
"Bitte wähle ein Brettfoto aus."
);

return;

}


const button =
document.getElementById(
"importButton"
);


button.disabled =
true;


button.textContent =
"Brett wird geschnitten …";


try{

const pieces =
await splitBoard(
file
);


/*
Positionen beginnen bei 1.
*/

for(
let i = 0;
i < pieces.length;
i++
){

button.textContent =
"Speichere " +
(i + 1) +
" / 140";


await addCap({

board:
boardName,

position:
i + 1,

image:
pieces[i],

status:
"available",

createdAt:
Date.now()

});

}


modal.classList.remove(
"open"
);


document.getElementById(
"boardName"
).value = "";


document.getElementById(
"boardImage"
).value = "";


await reload();


showToast(
"140 Kronkorken erstellt"
);

}
catch(error){

console.error(
error
);


alert(
"Das Brettfoto konnte nicht verarbeitet werden."
);

}
finally{

button.disabled =
false;


button.textContent =
"Importieren";

}

}
);


/* =========================
   STATUS
========================= */

document
.getElementById(
"grid"
)
.addEventListener(
"click",
async function(event){

const button =
event.target.closest(
"[data-status]"
);


if(
!button
){

return;

}


const id =
Number(
button.dataset.id
);


const status =
button.dataset.status;


const cap =
caps.find(
item =>
item.id === id
);


if(
!cap
){

return;

}


/*
Wenn Auswahl erneut angeklickt wird,
wird sie wieder entfernt.
*/

if(
cap.status === status &&
status !== "traded"
){

cap.status =
"available";

}
else{

cap.status =
status;

}


await updateCap(
cap
);


await reload();

}
);


/* =========================
   FILTER
========================= */

document
.querySelectorAll(
".tab"
)
.forEach(button=>{

button.addEventListener(
"click",
function(){

document
.querySelectorAll(
".tab"
)
.forEach(item=>{

item.classList.remove(
"active"
);

});


button.classList.add(
"active"
);


currentFilter =
button.dataset.filter;


render();

}
);

});


document
.getElementById(
"search"
)
.addEventListener(
"input",
render
);


/* =========================
   TEILEN
========================= */

document
.getElementById(
"shareButton"
)
.addEventListener(
"click",
function(){

alert(
"Der sichere Tauschmodus kommt wieder dazu, sobald wir geprüft haben, ob die 140 Kronkorken sauber ausgeschnitten werden."
);

}
);


/* =========================
   START
========================= */

async function reload(){

caps =
await getAllCaps();


caps.sort(
(a,b)=>
a.id - b.id
);


render();

}


async function start(){

try{

db =
await openDatabase();


await reload();

}
catch(error){

console.error(
error
);


alert(
"CapTrade konnte den lokalen Speicher nicht öffnen."
);

}

}


start();

</script>

</body>
</html>
